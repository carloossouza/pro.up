    // FIREBASE STATE MANAGEMENT
    let db = null;
    let isCloudActive = false;

    function initFirebase() {
      const savedConfig = localStorage.getItem('proup_firebase_config_v1');
      if (savedConfig) {
        try {
          const config = JSON.parse(savedConfig);
          if (!firebase.apps.length) {
            firebase.initializeApp(config);
          }
          db = firebase.firestore();
          isCloudActive = true;
          listenToCloud();
        } catch (err) {
          console.error("Erro no Firebase:", err);
          isCloudActive = false;
        }
      }
    }

    function listenToCloud() {
      if (!db) return;

      // Realtime listener for Architects
      db.collection("architects").onSnapshot(snapshot => {
        const archs = [];
        snapshot.forEach(doc => archs.push({ id: doc.id, ...doc.data() }));
        if (archs.length > 0) {
          state.architects = archs;
          saveLocalData(state.users, state.architects);
          renderApp();
        } else {
          // Upload initial if empty
          seedCloudData();
        }
      });

      // Realtime listener for Users
      db.collection("users").onSnapshot(snapshot => {
        const users = [];
        snapshot.forEach(doc => users.push(doc.data()));
        if (users.length > 0) {
          state.users = users;
          saveLocalData(state.users, state.architects);
          renderApp();
        }
      });
    }

    function seedCloudData() {
      if (!db) return;
      INITIAL_ARCHITECTS.forEach(a => {
        db.collection("architects").doc(a.id).set(a);
      });
      INITIAL_USERS.forEach(u => {
        db.collection("users").doc(u.username).set(u);
      });
    }

    function syncDataToCloud(type, data) {
      if (!db || !isCloudActive) return;
      if (type === 'architect') {
        db.collection("architects").doc(data.id).set(data);
      } else if (type === 'user') {
        db.collection("users").doc(data.username).set(data);
      }
    }

    function deleteUserFromCloud(username) {
      if (!db || !isCloudActive) return;
      db.collection("users").doc(username).delete();
    }

    // LOCAL STORAGE FALLBACK

      const storedUsers = localStorage.getItem('proup_users_v4');
      const storedArchs = localStorage.getItem('proup_architects_v4');
      return {
        users: storedUsers ? JSON.parse(storedUsers) : INITIAL_USERS,
        architects: storedArchs ? JSON.parse(storedArchs) : INITIAL_ARCHITECTS
      };
    }

    function saveLocalData(users, architects) {
      if (users) localStorage.setItem('proup_users_v4', JSON.stringify(users));
      if (architects) localStorage.setItem('proup_architects_v4', JSON.stringify(architects));
    }

    function getCurrentSession() {
      const sess = localStorage.getItem('proup_session_v4');
      return sess ? JSON.parse(sess) : null;
    }

    function setSession(user) {
      if (user) localStorage.setItem('proup_session_v4', JSON.stringify(user));
      else localStorage.removeItem('proup_session_v4');
    }

      state = { ...state, ...newState };

      const user = state.users.find(item => item.username.toLowerCase() === u && item.pass === p);

        setSession(user);
        updateState({ currentUser: user, currentTab: 'architects' });
      } else {
        const err = document.getElementById('login-error');
        err.innerText = 'Usuário ou senha incorretos!';
        err.classList.remove('hidden');
      }
    }

      setSession(null);
      updateState({ currentUser: null });

        } else if (state.consultantFilter !== 'all') {

          } else {

          const matchPhone = (a.phone || '').toLowerCase().includes(q);

                <option value="Reunião marcada" ${state.statusFilter === 'Reunião marcada' ? 'selected' : ''}>Reunião marcada</option>
                <option value="Proposta Enviada" ${state.statusFilter === 'Proposta Enviada' ? 'selected' : ''}>Proposta Enviada</option>
                <option value="Parceria Fechada" ${state.statusFilter === 'Parceria Fechada' ? 'selected' : ''}>Parceria Fechada</option>

            <div class="bg-white p-4 rounded-xl border border-brand-border shadow-sm">
              <p class="text-xs text-emerald-600 uppercase font-semibold">Reuniões / Fechados</p>
              <p class="text-2xl font-bold text-emerald-600 mt-1">${filtered.filter(a => a.status === 'Reunião marcada' || a.status === 'Parceria Fechada').length}</p>
            </div>
            <div class="bg-white p-4 rounded-xl border border-brand-border shadow-sm">
              <p class="text-xs text-rose-600 uppercase font-semibold">Follow-ups Atrasados</p>
              <p class="text-2xl font-bold text-rose-600 mt-1">${filtered.filter(a => a.nextFollowUp && a.nextFollowUp < today).length}</p>

          <!-- CARDS LIST -->
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            ${filtered.length === 0 ? `

    function renderArchitectCard(a, today) {
      const cleanPhone = (a.phone || '').replace(/\D/g, '');
      const waLink = `https://api.whatsapp.com/send?phone=55${cleanPhone}&text=Olá%20${encodeURIComponent(a.name)},%20sou%20da%20equipe%20Pro%20Up!`;

      return `
        <div class="bg-white rounded-xl border ${isOverdue ? 'border-rose-300 ring-1 ring-rose-300' : 'border-brand-border'} shadow-sm hover:shadow-md transition flex flex-col justify-between overflow-hidden">
          <div class="p-5 space-y-3 flex-1">

              ${a.instagram ? `
                <div class="flex items-center text-brand-text">
                  <i class="fa-brands fa-instagram w-5 text-brand-muted"></i>
                  <a href="${instaLink}" target="_blank" class="text-emerald-700 hover:underline font-medium">${a.instagram}</a>

              <div class="flex items-center text-brand-text">
                <i class="fa-solid fa-user-check w-5 text-brand-muted"></i>

            <div class="pt-2 border-t border-brand-border/60 text-xs space-y-1">

                <span class="text-brand-muted">Próximo Follow-up:</span>

                  ${a.nextFollowUp ? formatDate(a.nextFollowUp) : 'Não agendado'}
                  ${isOverdue ? ' (Atrasado)' : ''}
                </span>
              </div>

              ${a.history && a.history.length > 0 ? `
                <div class="bg-brand-bg p-2 rounded text-[11px] text-brand-muted mt-2 border border-brand-border/40">
                  <p class="font-semibold text-brand text-[10px] uppercase">Último Feedback por ${a.history[a.history.length - 1].user} (${formatDate(a.history[a.history.length - 1].date)}):</p>

              <span>WhatsApp</span>

              </button>

        </div>

    function getStatusStyle(status) {
      switch(status) {
        case 'Novo': return 'bg-blue-100 text-blue-800 border border-blue-200';
        case 'Em Contato': return 'bg-amber-100 text-amber-800 border border-amber-200';
        case 'Reunião marcada': return 'bg-emerald-100 text-emerald-800 border border-emerald-200';
        case 'Proposta Enviada': return 'bg-purple-100 text-purple-800 border border-purple-200';
        case 'Parceria Fechada': return 'bg-green-100 text-green-800 border border-green-200';
        case 'Sem Interesse': return 'bg-gray-100 text-gray-800 border border-gray-200';
        default: return 'bg-gray-100 text-gray-800';
      }
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
      return dateStr;
    }

    // TAB 2: AUDIT DASHBOARD
    function renderAuditDashboard() {
      const today = new Date().toISOString().split('T')[0];
      
      const totalArchs = state.architects.length;
      const unassigned = state.architects.filter(a => !a.consultant).length;
      const uncontacted = state.architects.filter(a => !a.history || a.history.length === 0).length;
      const overdueFollowUps = state.architects.filter(a => a.nextFollowUp && a.nextFollowUp < today);

      const consultants = state.users.filter(u => u.role === 'consultant');
      const consultantStats = consultants.map(c => {
        const myArchs = state.architects.filter(a => a.consultant === c.name);
        const contacted = myArchs.filter(a => a.history && a.history.length > 0).length;
        const overdue = myArchs.filter(a => a.nextFollowUp && a.nextFollowUp < today).length;
        const meetings = myArchs.filter(a => a.status === 'Reunião marcada' || a.status === 'Parceria Fechada').length;

      return `
        <div class="space-y-6">

          <div class="grid grid-cols-1 md:grid-cols-4 gap-4">

              <p class="text-3xl font-bold text-brand mt-1">${totalArchs}</p>

            <div class="bg-white p-5 rounded-xl border border-brand-border shadow-sm">
              <p class="text-xs text-amber-600 uppercase font-semibold">Nunca Contatados</p>
              <p class="text-3xl font-bold text-amber-600 mt-1">${uncontacted}</p>
            </div>
            <div class="bg-white p-5 rounded-xl border border-brand-border shadow-sm">
              <p class="text-xs text-rose-600 uppercase font-semibold">Follow-ups Atrasados</p>
              <p class="text-3xl font-bold text-rose-600 mt-1">${overdueFollowUps.length}</p>
            </div>
            <div class="bg-white p-5 rounded-xl border border-brand-border shadow-sm">
              <p class="text-xs text-blue-600 uppercase font-semibold">Na Fila Geral</p>
              <p class="text-3xl font-bold text-blue-600 mt-1">${unassigned}</p>
            </div>
          </div>

          <div class="bg-white rounded-xl border border-brand-border shadow-sm overflow-hidden">
            <div class="p-5 border-b border-brand-border bg-brand-bg">
              <h3 class="font-bold text-brand text-sm">Resumo de Atividades por Consultor</h3>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs">
                <thead class="bg-brand-bg border-b border-brand-border text-brand-muted uppercase font-semibold">
                  <tr>
                    <th class="p-4">Consultor</th>
                    <th class="p-4 text-center">Arquitetos</th>
                    <th class="p-4 text-center">Já Contatados</th>
                    <th class="p-4 text-center">Atrasados</th>
                    <th class="p-4 text-center">Reuniões / Fechados</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-brand-border">
                  ${consultantStats.map(s => `
                    <tr class="hover:bg-brand-bg/50">
                      <td class="p-4 font-bold text-brand">${s.name}</td>
                      <td class="p-4 text-center font-mono text-sm">${s.total}</td>
                      <td class="p-4 text-center font-mono text-sm text-emerald-700">${s.contacted} / ${s.total}</td>
                      <td class="p-4 text-center font-mono text-sm ${s.overdue > 0 ? 'text-rose-600 font-bold' : 'text-gray-400'}">${s.overdue}</td>
                      <td class="p-4 text-center font-mono text-sm font-bold text-brand">${s.meetings}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    // TAB 3: USER MANAGEMENT
    function renderUsersManagement() {
      return `
        <div class="space-y-6">
          <div class="bg-white p-6 rounded-xl border border-brand-border shadow-sm flex flex-col sm:flex-row justify-between items-center gap-4">

              <h2 class="text-xl font-bold text-brand font-brand">Gestão de Usuários e Consultores</h2>

    // MODAL INTERACTION
    function openInteractionModal(id) {
      const arch = state.architects.find(a => a.id === id);
      if (arch) {
        state.selectedArchitectForInteraction = arch;
        renderApp();
      }
    }

    function closeInteractionModal() {
      state.selectedArchitectForInteraction = null;
      renderApp();
    }

    function saveInteraction(e) {
      e.preventDefault();
      const arch = state.selectedArchitectForInteraction;
      if (!arch) return;

      const newStatus = document.getElementById('inter-status').value;
      const nextDate = document.getElementById('inter-nextdate').value;
      const notes = document.getElementById('inter-notes').value.trim();

      const today = new Date().toISOString().split('T')[0];

      const updatedHistory = arch.history || [];
      updatedHistory.push({
        date: today,
        user: state.currentUser.name,
        notes: notes
      });

      const updatedArchitect = {
        ...arch,
        status: newStatus,
        nextFollowUp: nextDate,
        history: updatedHistory
      };

      const updatedArchitects = state.architects.map(a => a.id === arch.id ? updatedArchitect : a);

      state.selectedArchitectForInteraction = null;
      syncDataToCloud('architect', updatedArchitect);
      updateState({ architects: updatedArchitects });
    }

      const a = state.selectedArchitectForInteraction;
      const today = new Date().toISOString().split('T')[0];

      return `
        <div class="fixed inset-0 bg-brand-dark/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">

                <select id="inter-status" required class="w-full p-2.5 bg-brand-bg border border-brand-border rounded-lg text-brand-text font-medium focus:outline-none focus:ring-2 focus:ring-brand">
                  <option value="Novo" ${a.status === 'Novo' ? 'selected' : ''}>Novo</option>
                  <option value="Em Contato" ${a.status === 'Em Contato' ? 'selected' : ''}>Em Contato</option>
                  <option value="Reunião marcada" ${a.status === 'Reunião marcada' ? 'selected' : ''}>Reunião marcada</option>

                  <option value="Parceria Fechada" ${a.status === 'Parceria Fechada' ? 'selected' : ''}>Parceria Fechada</option>
                  <option value="Sem Interesse" ${a.status === 'Sem Interesse' ? 'selected' : ''}>Sem Interesse</option>

                <div class="space-y-2 max-h-32 overflow-y-auto pr-1">
                  ${!a.history || a.history.length === 0 ? '<p class="text-brand-muted italic">Nenhum histórico anterior.</p>' :

                      <div class="bg-brand-bg p-2 rounded border border-brand-border/60 text-[11px]">

    // MODAL FIREBASE CONFIG
    function openFirebaseModal() {
      state.isFirebaseModalOpen = true;
      renderApp();
    }

      state.isFirebaseModalOpen = false;
      renderApp();
    }

    function saveFirebaseConfig(e) {
      e.preventDefault();
      const raw = document.getElementById('firebase-json').value.trim();
      try {
        const parsed = JSON.parse(raw);
        localStorage.setItem('proup_firebase_config_v1', JSON.stringify(parsed));
        state.isFirebaseModalOpen = false;
        alert("Configuração da Nuvem salva com sucesso! O sistema irá reiniciar a conexão.");
        window.location.reload();
      } catch (err) {
        alert("Formato JSON inválido! Cole exatamente o objeto const firebaseConfig do console do Firebase.");
      }
    }

    function renderFirebaseModal() {
      return `
        <div class="fixed inset-0 bg-brand-dark/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div class="bg-white rounded-2xl max-w-lg w-full border border-brand-border shadow-2xl overflow-hidden">
            <div class="bg-brand text-white p-5 flex justify-between items-center">
              <h3 class="font-bold text-base font-brand">Configurar Nuvem Real-time (Firebase)</h3>
              <button onclick="closeFirebaseModal()" class="text-gray-300 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <form onsubmit="saveFirebaseConfig(event)" class="p-6 space-y-4 text-xs">
              <p class="text-brand-muted leading-relaxed">
                Cole abaixo as chaves do seu projeto gratuito do Firebase (Firestore) para ativar a sincronização instantânea em tempo real para toda a equipe.
              </p>

              <div>
                <label class="block font-semibold text-brand mb-1">JSON da firebaseConfig *</label>
                <textarea id="firebase-json" rows="8" required placeholder='{\n  "apiKey": "AIzaSy...",\n  "authDomain": "proup.firebaseapp.com",\n  "projectId": "proup-crm",\n  "storageBucket": "proup.appspot.com",\n  "messagingSenderId": "...",\n  "appId": "..."\n}' class="w-full p-2.5 bg-brand-bg border border-brand-border font-mono rounded-lg text-brand-text focus:outline-none focus:ring-2 focus:ring-brand"></textarea>
              </div>

              <div class="pt-4 border-t border-brand-border flex justify-end space-x-3">
                <button type="button" onclick="closeFirebaseModal()" class="px-4 py-2 bg-gray-200 text-brand font-semibold rounded-lg">Cancelar</button>
                <button type="submit" class="px-5 py-2 bg-brand text-white font-semibold rounded-lg hover:bg-brand-light transition">Ativar Nuvem</button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    // MODALS EDIT ARCHITECT / USER / DELETE
    function openArchitectModal(id = null) {
      state.architectToEdit = id ? state.architects.find(a => a.id === id) : { id: '', name: '', company: '', city: 'Rio de Janeiro/RJ', phone: '', email: '', instagram: '', consultant: '', status: 'Novo' };
      renderApp();
    }

    function closeArchitectModal() {
      state.architectToEdit = null;
      renderApp();
    }

    function saveArchitect(e) {
      e.preventDefault();
      const a = state.architectToEdit;
      const name = document.getElementById('arch-name').value.trim();
      const company = document.getElementById('arch-company').value.trim();
      const phone = document.getElementById('arch-phone').value.trim();
      const email = document.getElementById('arch-email').value.trim();
      const instagram = document.getElementById('arch-instagram').value.trim();
      const city = document.getElementById('arch-city').value.trim();
      const consultant = document.getElementById('arch-consultant').value;
      const status = document.getElementById('arch-status').value;

      let list = [...state.architects];
      let updatedObj;

      if (a.id) {
        updatedObj = { ...a, name, company, phone, email, instagram, city, consultant, status };
        list = list.map(item => item.id === a.id ? updatedObj : item);
      } else {
        const nextId = `A${String(list.length + 1).padStart(4, '0')}`;
        const today = new Date().toISOString().split('T')[0];
        updatedObj = { id: nextId, entryDate: today, name, company, phone, email, instagram, city, consultant, status, history: [] };
        list.push(updatedObj);
      }

      state.architectToEdit = null;
      syncDataToCloud('architect', updatedObj);
      updateState({ architects: list });
    }

    function renderArchitectModal() {
      const a = state.architectToEdit;
      const consultants = state.users.filter(u => u.role === 'consultant');

      return `
        <div class="fixed inset-0 bg-brand-dark/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div class="bg-white rounded-2xl max-w-lg w-full border border-brand-border shadow-2xl overflow-hidden">
            <div class="bg-brand text-white p-5 flex justify-between items-center">
              <h3 class="font-bold text-base font-brand">${a.id ? 'Editar Arquiteto' : 'Cadastrar Arquiteto'}</h3>
              <button onclick="closeArchitectModal()" class="text-gray-300 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <form onsubmit="saveArchitect(event)" class="p-6 space-y-4 text-xs">
              <div>
                <label class="block font-semibold text-brand mb-1">Nome Completo *</label>
                <input type="text" id="arch-name" required value="${a.name || ''}" class="w-full p-2.5 bg-brand-bg border border-brand-border rounded-lg text-brand-text">
              </div>

              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block font-semibold text-brand mb-1">Escritório / Empresa</label>
                  <input type="text" id="arch-company" value="${a.company || ''}" class="w-full p-2.5 bg-brand-bg border border-brand-border rounded-lg text-brand-text">
                </div>
                <div>
                  <label class="block font-semibold text-brand mb-1">Cidade/UF</label>
                  <input type="text" id="arch-city" value="${a.city || 'Rio de Janeiro/RJ'}" class="w-full p-2.5 bg-brand-bg border border-brand-border rounded-lg text-brand-text">
                </div>
              </div>

              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block font-semibold text-brand mb-1">Telefone/WhatsApp *</label>
                  <input type="text" id="arch-phone" required value="${a.phone || ''}" class="w-full p-2.5 bg-brand-bg border border-brand-border rounded-lg text-brand-text">
                </div>
                <div>
                  <label class="block font-semibold text-brand mb-1">Instagram (@)</label>
                  <input type="text" id="arch-instagram" value="${a.instagram || ''}" class="w-full p-2.5 bg-brand-bg border border-brand-border rounded-lg text-brand-text">
                </div>
              </div>

              <div>
                <label class="block font-semibold text-brand mb-1">E-mail de Contato</label>
                <input type="email" id="arch-email" value="${a.email || ''}" class="w-full p-2.5 bg-brand-bg border border-brand-border rounded-lg text-brand-text">
              </div>

              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block font-semibold text-brand mb-1">Consultor Atribuído</label>
                  <select id="arch-consultant" class="w-full p-2.5 bg-brand-bg border border-brand-border rounded-lg text-brand-text">
                    <option value="">Sem Consultor (Fila)</option>
                    ${consultants.map(c => `<option value="${c.name}" ${a.consultant === c.name ? 'selected' : ''}>${c.name}</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label class="block font-semibold text-brand mb-1">Status</label>
                  <select id="arch-status" class="w-full p-2.5 bg-brand-bg border border-brand-border rounded-lg text-brand-text">
                    <option value="Novo" ${a.status === 'Novo' ? 'selected' : ''}>Novo</option>
                    <option value="Em Contato" ${a.status === 'Em Contato' ? 'selected' : ''}>Em Contato</option>
                    <option value="Reunião marcada" ${a.status === 'Reunião marcada' ? 'selected' : ''}>Reunião marcada</option>
                    <option value="Proposta Enviada" ${a.status === 'Proposta Enviada' ? 'selected' : ''}>Proposta Enviada</option>
                    <option value="Parceria Fechada" ${a.status === 'Parceria Fechada' ? 'selected' : ''}>Parceria Fechada</option>
                    <option value="Sem Interesse" ${a.status === 'Sem Interesse' ? 'selected' : ''}>Sem Interesse</option>
                  </select>
                </div>
              </div>

              <div class="pt-4 border-t border-brand-border flex justify-end space-x-3">
                <button type="button" onclick="closeArchitectModal()" class="px-4 py-2 bg-gray-200 text-brand font-semibold rounded-lg">Cancelar</button>
                <button type="submit" class="px-5 py-2 bg-brand text-white font-semibold rounded-lg hover:bg-brand-light transition">Salvar</button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function openUserModal(username = null) {
      state.userToEdit = username ? state.users.find(u => u.username === username) : { username: '', pass: '123456', name: '', role: 'consultant' };
      state.isUserModalOpen = true;
      renderApp();
    }

    function closeUserModal() {
      state.isUserModalOpen = false;
      state.userToEdit = null;
      renderApp();
    }

    function saveUser(e) {
      e.preventDefault();
      const name = document.getElementById('usr-name').value.trim();
      const username = document.getElementById('usr-username').value.trim().toLowerCase();
      const pass = document.getElementById('usr-pass').value.trim();
      const role = document.getElementById('usr-role').value;

      let users = [...state.users];
      const newUserObj = { username, pass, name, role };

      if (users.some(u => u.username === username)) {
        users = users.map(u => u.username === username ? newUserObj : u);
      } else {
        users.push(newUserObj);
      }

      state.isUserModalOpen = false;
      state.userToEdit = null;
      syncDataToCloud('user', newUserObj);
      updateState({ users });
    }

    function renderUserModal() {
      const u = state.userToEdit;
      const isEdit = !!u.username;

      return `
        <div class="fixed inset-0 bg-brand-dark/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div class="bg-white rounded-2xl max-w-md w-full border border-brand-border shadow-2xl overflow-hidden">
            <div class="bg-brand text-white p-5 flex justify-between items-center">
              <h3 class="font-bold text-base font-brand">${isEdit ? 'Editar Usuário' : 'Novo Usuário'}</h3>
              <button onclick="closeUserModal()" class="text-gray-300 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <form onsubmit="saveUser(event)" class="p-6 space-y-4 text-xs">
              <div>
                <label class="block font-semibold text-brand mb-1">Nome Completo *</label>
                <input type="text" id="usr-name" required value="${u.name || ''}" class="w-full p-2.5 bg-brand-bg border border-brand-border rounded-lg text-brand-text">
              </div>

              <div>
                <label class="block font-semibold text-brand mb-1">Login (Username) *</label>
                <input type="text" id="usr-username" ${isEdit ? 'readonly' : 'required'} value="${u.username || ''}" class="w-full p-2.5 bg-brand-bg border border-brand-border rounded-lg text-brand-text ${isEdit ? 'opacity-60 cursor-not-allowed' : ''}">
              </div>

              <div>
                <label class="block font-semibold text-brand mb-1">Senha *</label>
                <input type="password" id="usr-pass" required value="${u.pass || '123456'}" class="w-full p-2.5 bg-brand-bg border border-brand-border rounded-lg text-brand-text">
              </div>

              <div>
                <label class="block font-semibold text-brand mb-1">Função *</label>
                <select id="usr-role" required class="w-full p-2.5 bg-brand-bg border border-brand-border rounded-lg text-brand-text">
                  <option value="consultant" ${u.role === 'consultant' ? 'selected' : ''}>Consultor Comercial</option>
                  <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Administrador</option>
                </select>
              </div>

              <div class="pt-4 border-t border-brand-border flex justify-end space-x-3">
                <button type="button" onclick="closeUserModal()" class="px-4 py-2 bg-gray-200 text-brand font-semibold rounded-lg">Cancelar</button>
                <button type="submit" class="px-5 py-2 bg-brand text-white font-semibold rounded-lg hover:bg-brand-light transition">Salvar Usuário</button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function promptDeleteUser(username) {
      const u = state.users.find(item => item.username === username);
      if (u) {
        state.userToDelete = u;
        renderApp();
      }
    }

    function closeDeleteUserModal() {
      state.userToDelete = null;
      renderApp();
    }

    function confirmDeleteUser() {
      const u = state.userToDelete;
      if (!u) return;

      const newConsultant = document.getElementById('reassign-target').value;

      const updatedArchitects = state.architects.map(a => {
        if (a.consultant === u.name) {
          const updated = { ...a, consultant: newConsultant };
          syncDataToCloud('architect', updated);
          return updated;
        }
        return a;
      });

      const updatedUsers = state.users.filter(item => item.username !== u.username);

      deleteUserFromCloud(u.username);
      state.userToDelete = null;
      updateState({ users: updatedUsers, architects: updatedArchitects });
    }

    function renderDeleteUserModal() {
      const u = state.userToDelete;
      const otherConsultants = state.users.filter(item => item.username !== u.username);
      const count = state.architects.filter(a => a.consultant === u.name).length;

      return `
        <div class="fixed inset-0 bg-brand-dark/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div class="bg-white rounded-2xl max-w-md w-full border border-brand-border shadow-2xl overflow-hidden">
            <div class="bg-rose-700 text-white p-5 flex justify-between items-center">
              <h3 class="font-bold text-base font-brand flex items-center gap-2">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span>Remover Consultor</span>
              </h3>
              <button onclick="closeDeleteUserModal()" class="text-gray-300 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <div class="p-6 space-y-4 text-xs text-brand-text">
              <p>Você está prestes a remover o usuário <strong>${u.name}</strong> (${u.username}).</p>

              <div class="bg-amber-50 border border-amber-200 p-3 rounded-lg space-y-2">
                <p class="font-semibold text-amber-800">Reatribuir Carteira de Arquitetos (${count} arquiteto(s)):</p>
                <select id="reassign-target" class="w-full p-2 bg-white border border-amber-300 rounded text-xs">
                  <option value="">Deixar "Sem Consultor" (Fila Geral)</option>
                  ${otherConsultants.map(c => `<option value="${c.name}">${c.name}</option>`).join('')}
                </select>
              </div>

              <div class="pt-4 border-t border-brand-border flex justify-end space-x-3">
                <button type="button" onclick="closeDeleteUserModal()" class="px-4 py-2 bg-gray-200 text-brand font-semibold rounded-lg">Cancelar</button>
                <button type="button" onclick="confirmDeleteUser()" class="px-5 py-2 bg-rose-600 text-white font-semibold rounded-lg hover:bg-rose-700 transition">Confirmar Exclusão</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // INITIAL STARTUP
    initFirebase();
    renderApp();
  </script>
</body>
</html>
