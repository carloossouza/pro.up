    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = 'toast-notification pointer-events-auto px-4 py-3 rounded-xl shadow-2xl text-xs font-semibold text-white flex items-center gap-2 ' + (type === 'success' ? 'bg-emerald-700 border border-emerald-500' : 'bg-rose-700 border border-rose-500');
      toast.innerHTML = '<i class="fa-solid ' + (type === 'success' ? 'fa-circle-check text-emerald-300' : 'fa-triangle-exclamation text-rose-300') + '"></i> ' + message;
      container.appendChild(toast);
      setTimeout(function() { toast.remove(); }, 3500);
    }

    async function initSupabase() {
      try {
        if (window.supabase) {
          supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
          isSupabaseActive = true;
          await loadDataFromSupabase();
        }
      } catch (e) {
        console.error("Erro Supabase:", e);
        isSupabaseActive = false;
        render();
      }
    }

    async function loadDataFromSupabase() {
      if (!isSupabaseActive) return;
      try {
        const { data: archs } = await supabaseClient.from('architects').select('*');
        if (archs && archs.length > 0) state.architects = archs;
        else {
          for (let a of DEFAULT_ARCHITECTS) await supabaseClient.from('architects').upsert([a]);
        }

        const { data: users } = await supabaseClient.from('users').select('*');
        if (users && users.length > 0) state.users = users;
        else {
          for (let u of DEFAULT_USERS) await supabaseClient.from('users').upsert([u]);
        }

        const { data: events } = await supabaseClient.from('events').select('*');
        if (events) state.events = events;

        render();
      } catch (e) {
        console.error("Erro ao carregar dados:", e);
      }
    }

    async function saveConsultantAssignment(archId) {
      const selectEl = document.getElementById('select-consultant-' + archId);
      if (!selectEl) return;
      const newConsultant = selectEl.value;

      const arch = state.architects.find(function(a) { return a.id === archId; });
      if (arch) {
        arch.consultant = newConsultant;
        if (isSupabaseActive && supabaseClient) {
          const { error } = await supabaseClient.from('architects').upsert([arch]);
          if (error) showToast("Erro: " + error.message, "error");
          else showToast("Sucesso! " + arch.name + " atribuído a " + (newConsultant || 'Fila') + ".");
        }
        render();
      }
    }

    async function createNewArchitect(e) {
      e.preventDefault();
      const name = document.getElementById('new-arch-name').value.trim();
      const company = document.getElementById('new-arch-company').value.trim();
      const city = document.getElementById('new-arch-city').value.trim() || "Rio de Janeiro/RJ";
      const phone = document.getElementById('new-arch-phone').value.trim();
      const email = document.getElementById('new-arch-email').value.trim();
      const consultant = document.getElementById('new-arch-consultant').value;

      const newId = "A" + String(state.architects.length + 1000).padStart(4, '0');
      const newArch = {
        id: newId,
        entryDate: new Date().toISOString().split('T')[0],
        name: name,
        company: company,
        city: city,
        phone: phone,
        email: email,
        consultant: consultant,
        status: "Novo",
        nextFollowUp: "",
        history: []
      };

      if (isSupabaseActive && supabaseClient) {
        const { error } = await supabaseClient.from('architects').upsert([newArch]);
        if (error) showToast("Erro: " + error.message, "error");
        else {
          state.architects.unshift(newArch);
          showToast("Novo arquiteto salvo!");
        }
      } else {
        state.architects.unshift(newArch);
      }

      state.showAddArchModal = false;
      render();
    }

    async function createNewUser(e) {
      e.preventDefault();
      const name = document.getElementById('new-u-name').value.trim();
      const username = document.getElementById('new-u-username').value.trim().toLowerCase();
      const pass = document.getElementById('new-u-pass').value.trim();
      const role = document.getElementById('new-u-role').value;

      const newUser = { username: username, pass: pass, name: name, role: role };
      if (isSupabaseActive && supabaseClient) {
        const { error } = await supabaseClient.from('users').upsert([newUser]);
        if (error) showToast("Erro: " + error.message, "error");
        else {
          state.users.push(newUser);
          showToast("Usuário criado!");
        }
      } else {
        state.users.push(newUser);
      }
      state.showAddUserModal = false;
      render();
    }

    async function saveEditedUser(e, oldUsername) {
      e.preventDefault();
      const name = document.getElementById('edit-u-name').value.trim();
      const username = document.getElementById('edit-u-username').value.trim().toLowerCase();
      const pass = document.getElementById('edit-u-pass').value.trim();
      const role = document.getElementById('edit-u-role').value;

      const u = state.users.find(function(user) { return user.username === oldUsername; });
      if (u) {
        if (oldUsername !== username && isSupabaseActive && supabaseClient) {
          await supabaseClient.from('users').delete().eq('username', oldUsername);
        }
        u.name = name; u.username = username; u.pass = pass; u.role = role;
        if (isSupabaseActive && supabaseClient) {
          await supabaseClient.from('users').upsert([u]);
          showToast("Usuário atualizado!");
        }
        state.editingUser = null;
        render();
      }
    }

    async function addGuestToEvent(e, eventId) {
      e.preventDefault();
      const name = document.getElementById('gst-name').value.trim();
      const company = document.getElementById('gst-company').value.trim();
      const contact = document.getElementById('gst-contact').value.trim();
      const confirmed = document.getElementById('gst-confirmed').value;

      const ev = state.events.find(function(ev) { return ev.id === eventId; });
      if (ev) {
        if (!ev.guests) ev.guests = [];
        ev.guests.push({
          id: 'G-' + Date.now(),
          name: name,
          company: company,
          contact: contact,
          confirmed: confirmed,
          attended: 'Não',
          addedBy: state.currentUser.name
        });

        if (isSupabaseActive && supabaseClient) {
          await supabaseClient.from('events').upsert([ev]);
          showToast("Convidado adicionado!");
        }
        render();
      }
    }

    async function updateGuestStatus(eventId, guestId, field, value) {
      const ev = state.events.find(function(ev) { return ev.id === eventId; });
      if (ev && ev.guests) {
        const guest = ev.guests.find(function(g) { return g.id === guestId; });
        if (guest) {
          guest[field] = value;
          if (isSupabaseActive && supabaseClient) {
            await supabaseClient.from('events').upsert([ev]);
            showToast("Atualizado!");
          }
          render();
        }
      }
    }

    function exportEventCSV(eventId) {
      const ev = state.events.find(function(ev) { return ev.id === eventId; });
      if (!ev || !ev.guests || ev.guests.length === 0) {
        alert("Nenhum convidado nesta lista.");
        return;
      }
      let csv = "Nome,Empresa,Contato,Confirmado,Compareceu,Adicionado Por\n";
      ev.guests.forEach(function(g) {
        csv += '"' + g.name + '","' + g.company + '","' + g.contact + '","' + g.confirmed + '","' + g.attended + '","' + g.addedBy + '"\n';
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'convidados_' + ev.title.replace(/\s+/g, '_') + '.csv';
      a.click();
    }

    function daysSince(dateStr) {
      if (!dateStr) return 0;
      const now = new Date();
      const past = new Date(dateStr);
      return Math.floor(Math.abs(now - past) / (1000 * 60 * 60 * 24));
    }

    function getLastContactDate(arch) {
      if (arch.history && arch.history.length > 0) return arch.history[arch.history.length - 1].date;
      return arch.entryDate;
    }

    function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('login-u').value.trim().toLowerCase();
      const p = document.getElementById('login-p').value.trim();
      const found = state.users.find(function(user) { return user.username.toLowerCase() === u && user.pass === p; });
      if (found) {
        state.currentUser = found;
        localStorage.setItem('proup_session', JSON.stringify(state.currentUser));
        render();
      } else {
        alert("Usuário ou senha incorretos!");

    }

    async function addFeedback(e, archId) {
      e.preventDefault();
      const status = document.getElementById('fb-status').value;
      const followUp = document.getElementById('fb-followup').value;
      const channel = document.getElementById('fb-channel').value;
      const otherChannel = document.getElementById('fb-other-channel') ? document.getElementById('fb-other-channel').value.trim() : '';
      const notes = document.getElementById('fb-notes').value.trim();

      const finalChannel = channel === 'Outro' ? (otherChannel || 'Outro') : channel;

      const arch = state.architects.find(function(a) { return a.id === archId; });
      if (arch) {
        arch.status = status;
        if (followUp) arch.nextFollowUp = followUp;
        if (!arch.history) arch.history = [];
        
        arch.history.push({
          date: new Date().toISOString().split('T')[0],
          user: state.currentUser.name,
          status: status,
          channel: finalChannel,
          notes: notes
        });

        if (isSupabaseActive && supabaseClient) {
          const { error } = await supabaseClient.from('architects').upsert([arch]);
          if (error) showToast("Erro ao salvar feedback: " + error.message, "error");
          else showToast("Feedback salvo com sucesso!");
        }

        state.selectedArchForFeedback = null;
        render();
      }
    }

          if (isElevated) {
            listHtml += '<div class="flex gap-1.5">' +
              '<select id="select-consultant-' + arch.id + '" class="flex-1 p-1.5 ' + (isUnassigned ? 'bg-amber-100 border-amber-300' : 'bg-brand-bg border-brand-border') + ' rounded text-xs font-semibold text-brand">' +
              '<option value="" ' + (isUnassigned ? 'selected' : '') + '>-- Sem Consultor (Fila) --</option>';

              listHtml += '<option value="' + u.name + '" ' + (arch.consultant === u.name ? 'selected' : '') + '>' + u.name + '</option>';
            });
            listHtml += '</select>' +
              '<button onclick="saveConsultantAssignment(\'' + arch.id + '\')" class="px-3 py-1.5 bg-brand text-white rounded text-xs font-semibold hover:bg-brand-light transition shadow"><i class="fa-solid fa-floppy-disk"></i> Salvar</button>' +
              '</div>';
          } else {
            listHtml += '<p class="text-brand font-semibold">' + (arch.consultant || 'Não Atribuído') + '</p>';
          }

          listHtml += '</div><p class="text-[11px] text-gray-400 pt-1"><i class="fa-regular fa-clock mr-1"></i> Cadastrado em: ' + arch.entryDate + '</p>' +
            '</div></div>' +
            '<div class="pt-3 border-t border-brand-border flex gap-2">' +
            '<button onclick="state.selectedArchForFeedback=\'' + arch.id + '\'; render();" class="flex-1 py-1.5 bg-brand text-white text-xs font-semibold rounded hover:bg-brand-light transition">+ Feedback</button>' +
            '<button onclick="state.selectedArchHistory=\'' + arch.id + '\'; render();" class="px-3 py-1.5 bg-brand-bg text-brand border border-brand-border text-xs font-semibold rounded hover:bg-white transition" title="Ver Histórico"><i class="fa-solid fa-history"></i></button>' +
            '<a href="https://wa.me/55' + arch.phone.replace(/\D/g, '') + '" target="_blank" class="px-3 py-1.5 bg-emerald-600 text-white text-xs font-semibold rounded hover:bg-emerald-700 transition flex items-center justify-center" title="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>' +
            '</div></div>';
        });
        listHtml += '</div>';
      }
      return listHtml + '</div>';
    }

    function renderAuditDashboard() {
      const selectedCons = window.auditConsultantFilter || 'all';

      if (selectedCons !== 'all') {
        targetArchs = state.architects.filter(function(a) { return a.consultant === selectedCons; });
      }

      const totalArchs = targetArchs.length;
      const totalContacts = targetArchs.reduce(function(acc, curr) { return acc + (curr.history ? curr.history.length : 0); }, 0);
      
      const sevenDaysAgo = new Date();
      sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);

      const contactsLast7Days = targetArchs.reduce(function(acc, curr) {

        return acc + curr.history.filter(function(h) { return new Date(h.date) >= sevenDaysAgo; }).length;
      }, 0);

      const unassigned = targetArchs.filter(function(a) { return !a.consultant || a.consultant === ''; }).length;

      const closedPartnerships = targetArchs.filter(function(a) { return a.status === 'Parceria Fechada'; }).length;

      const todayStr = new Date().toISOString().split('T')[0];
      const followUpsToday = targetArchs.filter(function(a) { return a.nextFollowUp === todayStr; }).length;
      const followUpsOverdue = targetArchs.filter(function(a) { return a.nextFollowUp && a.nextFollowUp < todayStr && a.status !== 'Parceria Fechada' && a.status !== 'Sem Interesse'; }).length;

      let html = '<div class="space-y-6">' +
        '<div class="bg-white p-6 rounded-xl border border-brand-border shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">' +
        '<div><h2 class="text-xl font-bold text-brand mb-1">Painel de Auditoria e Desempenho</h2><p class="text-xs text-brand-muted">Métricas e gráficos analíticos atualizados em tempo real.</p></div>' +
        '<div><label class="block text-[10px] text-brand-muted uppercase font-bold mb-1">Filtrar por Consultor:</label>' +
        '<select onchange="window.auditConsultantFilter=this.value; render();" class="p-2 bg-brand-bg border border-brand-border rounded text-xs font-semibold">' +
        '<option value="all" ' + (selectedCons === 'all' ? 'selected' : '') + '>Todos os Consultores (Geral)</option>';
      
      state.users.filter(function(u) { return u.role === 'consultant'; }).forEach(function(u) {
        html += '<option value="' + u.name + '" ' + (selectedCons === u.name ? 'selected' : '') + '>' + u.name + '</option>';
      });

      html += '</select></div></div>' +

      // Tabela de Métricas (Livre de Citações Indesejadas)
      '<div class="bg-white rounded-xl border border-brand-border shadow-sm overflow-x-auto">' +

        '<th class="p-3 border-r border-white/10">Arquitetos Cadastrados</th>' +
        '<th class="p-3 border-r border-white/10">Contatos Realizados</th>' +
        '<th class="p-3 border-r border-white/10">Contatos Últimos 7 Dias</th>' +
        '<th class="p-3 border-r border-white/10">Sem Nenhum Contato</th>' +
        '<th class="p-3 border-r border-white/10">Parados > 7 Dias</th>' +
        '<th class="p-3 border-r border-white/10">Reuniões Marcadas</th>' +
        '<th class="p-3 border-r border-white/10">Fechados</th>' +
        '<th class="p-3 border-r border-white/10">Alertas Críticos</th>' +
        '<th class="p-3 border-r border-white/10">Follow-ups Atrasados</th>' +
        '<th class="p-3">Follow-ups Hoje</th>' +
        '</tr></thead><tbody>' +
        '<tr class="text-lg font-bold text-brand bg-brand-bg">' +
        '<td class="p-4 border-r border-brand-border">' + totalArchs + '</td>' +
        '<td class="p-4 border-r border-brand-border text-emerald-700">' + totalContacts + '</td>' +
        '<td class="p-4 border-r border-brand-border text-blue-700">' + contactsLast7Days + '</td>' +
        '<td class="p-4 border-r border-brand-border text-amber-600">' + targetArchs.filter(function(a) { return !a.history || a.history.length === 0; }).length + '</td>' +
        '<td class="p-4 border-r border-brand-border text-rose-600">' + inactiveMoreThan7Days + '</td>' +
        '<td class="p-4 border-r border-brand-border text-purple-700">' + meetingsMarked + '</td>' +
        '<td class="p-4 border-r border-brand-border text-emerald-800">' + closedPartnerships + '</td>' +
        '<td class="p-4 border-r border-brand-border text-rose-700">' + unassigned + '</td>' +
        '<td class="p-4 border-r border-brand-border text-rose-600">' + followUpsOverdue + '</td>' +
        '<td class="p-4 text-amber-700">' + followUpsToday + '</td>' +
        '</tr></tbody></table></div>' +

      // SEÇÃO DE GRÁFICOS ANALÍTICOS
      '<div class="grid grid-cols-1 md:grid-cols-2 gap-6">' +
        '<div class="bg-white p-6 rounded-xl border border-brand-border shadow-sm flex flex-col items-center">' +

            '<canvas id="consultantChart"></canvas>' +
          '</div>' +
        '</div>' +

      return html;

    function initAuditCharts() {
      const selectedCons = window.auditConsultantFilter || 'all';
      let targetArchs = state.architects;
      if (selectedCons !== 'all') {
        targetArchs = state.architects.filter(function(a) { return a.consultant === selectedCons; });
      }

      // Dados para o Gráfico de Status (Rosca)
      const statusCounts = {
        'Novo': 0,
        'Em Contato': 0,
        'Reunião marcada': 0,
        'Proposta Enviada': 0,
        'Parceria Fechada': 0,
        'Sem Interesse': 0
      };

      targetArchs.forEach(function(a) {
        if (statusCounts[a.status] !== undefined) {
          statusCounts[a.status]++;
        } else {
          statusCounts['Novo']++;
        }
      });

      const statusCtx = document.getElementById('statusChart');
      if (statusCtx) {
        if (window.myStatusChart) window.myStatusChart.destroy();
        window.myStatusChart = new Chart(statusCtx, {
          type: 'doughnut',
          data: {
            labels: Object.keys(statusCounts),
            datasets: [{
              data: Object.values(statusCounts),
              backgroundColor: ['#616F65', '#3A4A3F', '#8B5CF6', '#3B82F6', '#059669', '#EF4444'],
              borderWidth: 2,
              borderColor: '#FFFFFF'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } }
            }
          }
        });
      }

      // Dados para o Gráfico por Consultor (Barras)
      const consultantNames = [];
      const consultantCounts = [];
      
      state.users.filter(function(u) { return u.role === 'consultant'; }).forEach(function(u) {
        consultantNames.push(u.name);
        consultantCounts.push(state.architects.filter(function(a) { return a.consultant === u.name; }).length);
      });

      const consultantCtx = document.getElementById('consultantChart');
      if (consultantCtx) {
        if (window.myConsultantChart) window.myConsultantChart.destroy();
        window.myConsultantChart = new Chart(consultantCtx, {
          type: 'bar',
          data: {
            labels: consultantNames,
            datasets: [{
              label: 'Arquitetos Atribuídos',
              data: consultantCounts,
              backgroundColor: '#2D3A31',
              borderRadius: 6
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false }
            },
            scales: {
              y: { beginAtZero: true, ticks: { precision: 0 } }
            }
          }
        });
      }
    }

        '<table class="w-full text-left border-collapse text-xs">' +
        '<thead><tr class="bg-brand text-white uppercase text-[10px]"><th class="p-3">Convidado</th><th class="p-3">Empresa</th><th class="p-3">Contato</th><th class="p-3">Adicionado Por</th><th class="p-3 text-center">Confirmado?</th><th class="p-3 text-center">Compareceu?</th></tr></thead>' +
        '<tbody class="divide-y divide-brand-border">' + guestsRows + '</tbody>' +
        '</table></div></div></div>';
    }

    function renderUsersManagement() {
      let html = '<div class="space-y-6"><div class="bg-white p-6 rounded-xl border border-brand-border shadow-sm flex justify-between items-center">' +
        '<div><h2 class="text-xl font-bold text-brand">Gestão de Usuários e Consultores</h2><p class="text-xs text-brand-muted">Cadastre novos consultores ou edite credenciais.</p></div>' +
        '<button onclick="state.showAddUserModal=true; render();" class="px-4 py-2 bg-brand text-white font-semibold text-xs rounded hover:bg-brand-light transition flex items-center gap-1 shadow"><i class="fa-solid fa-user-plus"></i> + Novo Usuário</button>' +
        '</div><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">';

      state.users.forEach(function(u) {
        const assignedCount = state.architects.filter(function(a) { return a.consultant === u.name; }).length;
        html += '<div class="p-5 bg-white rounded-xl border border-brand-border shadow-sm flex flex-col justify-between space-y-4">' +
          '<div class="flex justify-between items-start"><div>' +
          '<p class="font-bold text-base text-brand">' + u.name + '</p>' +
          '<p class="text-xs text-brand-muted">Login: <span class="font-mono text-brand font-semibold">' + u.username + '</span></p>' +
          '<span class="inline-block mt-2 text-[10px] font-bold uppercase px-2 py-0.5 rounded ' + (u.role === 'admin' ? 'bg-purple-100 text-purple-700' : (u.role === 'supervisor' ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700')) + '">' + (u.role === 'admin' ? 'Administrador' : (u.role === 'supervisor' ? 'Supervisora' : 'Consultor')) + '</span>' +
          '</div>' + (u.role === 'consultant' ? '<div class="text-right bg-brand-bg p-2 rounded-lg border border-brand-border"><span class="text-xl font-bold text-brand">' + assignedCount + '</span><p class="text-[10px] text-brand-muted">arquitetos</p></div>' : '') +
          '</div><div class="pt-3 border-t border-brand-border flex justify-between items-center">' +
          '<span class="text-xs text-gray-400">Senha: <span class="font-mono text-gray-600">' + u.pass + '</span></span>' +
          '<button onclick="state.editingUser=\'' + u.username + '\'; render();" class="px-3 py-1 bg-brand-bg text-brand border border-brand-border text-xs font-semibold rounded hover:bg-white transition"><i class="fa-solid fa-pen-to-square mr-1"></i> Editar</button>' +
          '</div></div>';
      });
      return html + '</div></div>';
    }

    function renderAddUserModal() {
      return '<div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">' +
        '<div class="bg-white max-w-md w-full rounded-2xl shadow-2xl border border-brand-border p-6 space-y-4">' +
        '<div class="flex justify-between items-center border-b pb-3"><h3 class="font-bold text-lg text-brand">Cadastrar Novo Usuário</h3><button onclick="state.showAddUserModal=false; render();" class="text-gray-400 hover:text-black">&times;</button></div>' +
        '<form onsubmit="createNewUser(event)" class="space-y-3">' +
        '<div><label class="block text-xs font-semibold text-brand-muted uppercase mb-1">Nome Completo *</label><input type="text" id="new-u-name" required class="w-full p-2 bg-brand-bg border border-brand-border rounded text-sm outline-none"></div>' +
        '<div><label class="block text-xs font-semibold text-brand-muted uppercase mb-1">Usuário (Login) *</label><input type="text" id="new-u-username" required class="w-full p-2 bg-brand-bg border border-brand-border rounded text-sm outline-none"></div>' +
        '<div><label class="block text-xs font-semibold text-brand-muted uppercase mb-1">Senha *</label><input type="text" id="new-u-pass" required class="w-full p-2 bg-brand-bg border border-brand-border rounded text-sm outline-none"></div>' +
        '<div><label class="block text-xs font-semibold text-brand-muted uppercase mb-1">Cargo</label><select id="new-u-role" class="w-full p-2 bg-brand-bg border border-brand-border rounded text-sm font-medium"><option value="consultant">Consultor</option><option value="supervisor">Supervisor(a)</option><option value="admin">Administrador</option></select></div>' +
        '<div class="flex gap-2 justify-end pt-3 border-t"><button type="button" onclick="state.showAddUserModal=false; render();" class="px-4 py-2 border rounded text-xs font-semibold">Cancelar</button><button type="submit" class="px-4 py-2 bg-brand text-white rounded text-xs font-semibold">Salvar</button></div>' +
        '</form></div></div>';
    }

    function renderEditUserModal() {
      const user = state.users.find(function(u) { return u.username === state.editingUser; });
      if (!user) return '';

      return '<div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">' +
        '<div class="bg-white max-w-md w-full rounded-2xl shadow-2xl border border-brand-border p-6 space-y-4">' +
        '<div class="flex justify-between items-center border-b pb-3"><h3 class="font-bold text-lg text-brand">Editar Usuário</h3><button onclick="state.editingUser=null; render();" class="text-gray-400 hover:text-black">&times;</button></div>' +
        '<form onsubmit="saveEditedUser(event, \'' + user.username + '\')" class="space-y-3">' +
        '<div><label class="block text-xs font-semibold text-brand-muted uppercase mb-1">Nome Completo *</label><input type="text" id="edit-u-name" value="' + user.name + '" required class="w-full p-2 bg-brand-bg border border-brand-border rounded text-sm outline-none"></div>' +
        '<div><label class="block text-xs font-semibold text-brand-muted uppercase mb-1">Usuário *</label><input type="text" id="edit-u-username" value="' + user.username + '" required class="w-full p-2 bg-brand-bg border border-brand-border rounded text-sm outline-none"></div>' +
        '<div><label class="block text-xs font-semibold text-brand-muted uppercase mb-1">Senha *</label><input type="text" id="edit-u-pass" value="' + user.pass + '" required class="w-full p-2 bg-brand-bg border border-brand-border rounded text-sm outline-none"></div>' +
        '<div><label class="block text-xs font-semibold text-brand-muted uppercase mb-1">Cargo</label><select id="edit-u-role" class="w-full p-2 bg-brand-bg border border-brand-border rounded text-sm font-medium"><option value="consultant" ' + (user.role === 'consultant' ? 'selected' : '') + '>Consultor</option><option value="supervisor" ' + (user.role === 'supervisor' ? 'selected' : '') + '>Supervisor(a)</option><option value="admin" ' + (user.role === 'admin' ? 'selected' : '') + '>Administrador</option></select></div>' +
        '<div class="flex gap-2 justify-end pt-3 border-t"><button type="button" onclick="state.editingUser=null; render();" class="px-4 py-2 border rounded text-xs font-semibold">Cancelar</button><button type="submit" class="px-4 py-2 bg-brand text-white rounded text-xs font-semibold">Salvar</button></div>' +
        '</form></div></div>';
    }

    function renderAddArchModal() {
      let optionsHtml = '<option value="">-- Sem Consultor (Fila) --</option>';
      state.users.filter(function(u) { return u.role === 'consultant'; }).forEach(function(u) {
        optionsHtml += '<option value="' + u.name + '">' + u.name + '</option>';
      });

      return '<div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">' +
        '<div class="bg-white max-w-lg w-full rounded-2xl shadow-2xl border border-brand-border p-6 space-y-4">' +
        '<div class="flex justify-between items-center border-b pb-3"><h3 class="font-bold text-lg text-brand">Cadastrar Novo Arquiteto</h3><button onclick="state.showAddArchModal=false; render();" class="text-gray-400 hover:text-black">&times;</button></div>' +
        '<form onsubmit="createNewArchitect(event)" class="space-y-3">' +
        '<div><label class="block text-xs font-semibold text-brand-muted uppercase mb-1">Nome Completo *</label><input type="text" id="new-arch-name" required class="w-full p-2 bg-brand-bg border border-brand-border rounded text-sm outline-none"></div>' +
        '<div><label class="block text-xs font-semibold text-brand-muted uppercase mb-1">Escritório / Empresa</label><input type="text" id="new-arch-company" class="w-full p-2 bg-brand-bg border border-brand-border rounded text-sm outline-none"></div>' +
        '<div class="grid grid-cols-2 gap-2"><div><label class="block text-xs font-semibold text-brand-muted uppercase mb-1">Telefone *</label><input type="text" id="new-arch-phone" required class="w-full p-2 bg-brand-bg border border-brand-border rounded text-sm outline-none"></div>' +
        '<div><label class="block text-xs font-semibold text-brand-muted uppercase mb-1">Cidade/UF</label><input type="text" id="new-arch-city" value="Rio de Janeiro/RJ" class="w-full p-2 bg-brand-bg border border-brand-border rounded text-sm outline-none"></div></div>' +
        '<div><label class="block text-xs font-semibold text-brand-muted uppercase mb-1">E-mail</label><input type="email" id="new-arch-email" class="w-full p-2 bg-brand-bg border border-brand-border rounded text-sm outline-none"></div>' +
        '<div><label class="block text-xs font-semibold text-brand-muted uppercase mb-1">Consultor</label><select id="new-arch-consultant" class="w-full p-2 bg-brand-bg border border-brand-border rounded text-sm font-medium">' + optionsHtml + '</select></div>' +
        '<div class="flex gap-2 justify-end pt-3 border-t"><button type="button" onclick="state.showAddArchModal=false; render();" class="px-4 py-2 border rounded text-xs font-semibold">Cancelar</button><button type="submit" class="px-4 py-2 bg-brand text-white rounded text-xs font-semibold">Salvar</button></div>' +
        '</form></div></div>';
    }

    function renderFeedbackModal() {
      const arch = state.architects.find(function(a) { return a.id === state.selectedArchForFeedback; });
      if (!arch) return '';

      return '<div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">' +
        '<div class="bg-white max-w-lg w-full rounded-2xl shadow-2xl border border-brand-border p-6 space-y-4">' +
        '<div class="flex justify-between items-center border-b pb-3"><h3 class="font-bold text-lg text-brand">Registrar Contato / Feedback</h3><button onclick="state.selectedArchForFeedback=null; render();" class="text-gray-400 hover:text-black">&times;</button></div>' +
        '<p class="text-xs text-brand-muted">Arquiteto(a): <strong class="text-brand">' + arch.name + '</strong></p>' +
        '<form onsubmit="addFeedback(event, \'' + arch.id + '\')" class="space-y-4">' +
        '<div><label class="block text-xs font-semibold text-brand-muted uppercase mb-1">Status</label><select id="fb-status" class="w-full p-2 bg-brand-bg border border-brand-border rounded text-sm font-medium"><option value="Em Contato">Em Contato</option><option value="Reunião marcada">Reunião marcada</option><option value="Proposta Enviada">Proposta Enviada</option><option value="Parceria Fechada">Parceria Fechada</option><option value="Sem Interesse">Sem Interesse</option></select></div>' +
        '<div><label class="block text-xs font-semibold text-brand-muted uppercase mb-1">Canal de Contato</label><select id="fb-channel" onchange="document.getElementById(\'other-channel-box\').style.display = this.value === \'Outro\' ? \'block\':\'none\';" class="w-full p-2 bg-brand-bg border border-brand-border rounded text-sm font-medium"><option value="WhatsApp">WhatsApp</option><option value="Instagram">Instagram</option><option value="Ligação">Ligação</option><option value="E-mail">E-mail</option><option value="Outro">Outro</option></select></div>' +
        '<div id="other-channel-box" style="display: none;"><label class="block text-xs font-semibold text-brand-muted uppercase mb-1">Especifique *</label><input type="text" id="fb-other-channel" class="w-full p-2 bg-brand-bg border border-brand-border rounded text-sm"></div>' +
        '<div><label class="block text-xs font-semibold text-brand-muted uppercase mb-1">Próximo Follow-up</label><input type="date" id="fb-followup" required class="w-full p-2 bg-brand-bg border border-brand-border rounded text-sm"></div>' +
        '<div><label class="block text-xs font-semibold text-brand-muted uppercase mb-1">Observações</label><textarea id="fb-notes" required rows="4" class="w-full p-2 bg-brand-bg border border-brand-border rounded text-sm outline-none"></textarea></div>' +
        '<div class="flex gap-2 justify-end pt-2"><button type="button" onclick="state.selectedArchForFeedback=null; render();" class="px-4 py-2 border rounded text-xs font-semibold">Cancelar</button><button type="submit" class="px-4 py-2 bg-brand text-white rounded text-xs font-semibold">Salvar</button></div>' +
        '</form></div></div>';
    }

    function renderHistoryModal() {
      const arch = state.architects.find(function(a) { return a.id === state.selectedArchHistory; });
      if (!arch) return '';

      let historyList = '';
      if (!arch.history || arch.history.length === 0) {
        historyList = '<p class="text-xs text-gray-400 italic">Nenhuma interação registrada ainda.</p>';
      } else {
        arch.history.forEach(function(h) {
          historyList += '<div class="p-3 bg-brand-bg rounded-lg border border-brand-border space-y-1">' +
            '<div class="flex justify-between text-xs font-bold text-brand"><span>' + h.user + (h.channel ? ' • <span class="text-emerald-700">' + h.channel + '</span>' : '') + '</span><span class="text-gray-400 font-normal">' + h.date + '</span></div>' +
            '<p class="text-xs text-brand font-semibold uppercase">' + h.status + '</p>' +
            '<p class="text-xs text-brand-text whitespace-pre-wrap">' + h.notes + '</p></div>';
        });
      }

      return '<div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">' +
        '<div class="bg-white max-w-xl w-full rounded-2xl shadow-2xl border border-brand-border p-6 space-y-4 max-h-[90vh] flex flex-col">' +
        '<div class="flex justify-between items-center border-b pb-3"><div><h3 class="font-bold text-lg text-brand">' + arch.name + '</h3><p class="text-xs text-brand-muted">' + (arch.company || 'Escritório Particular') + '</p></div><button onclick="state.selectedArchHistory=null; render();" class="text-gray-400 hover:text-black">&times;</button></div>' +
        '<div class="flex-1 overflow-y-auto space-y-3"><h4 class="font-bold text-xs text-brand uppercase">Histórico de Interações</h4>' + historyList + '</div></div></div>';
    }

    window.onload = function() {
      initSupabase();
      render();
    };
  </script>
</body>
</html>
