        function renderTable(data) {
            const tbody = document.getElementById('architects-table-body');
            document.getElementById('total-badge').innerText = `${data.length} Arquitetos Exibidos`;
            
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-slate-400">Nenhum arquiteto encontrado.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(arq => `
                <tr class="hover:bg-slate-700/35 transition">
                    <td class="py-3 px-4 font-mono text-xs text-indigo-400">${arq.id}</td>
                    <td class="py-3 px-4">
                        <div class="font-medium text-white">${arq.nome}</div>
                        <div class="text-xs text-slate-400">${arq.empresa || ''}</div>
                    </td>
                    <td class="py-3 px-4 text-slate-300 text-sm">${arq.telefone || '-'}</td>
                    <td class="py-3 px-4 text-slate-300 text-sm">${arq.email || '-'}</td>
                    <td class="py-3 px-4">
                        <select onchange="updateConsultant('${arq.id}', this.value)" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-white focus:outline-none focus:border-indigo-500">
                            <option value="">-- Sem Consultor --</option>
                            ${consultoresList.map(c => `<option value="${c}" ${arq.consultor === c ? 'selected' : ''}>${c}</option>`).join('')}
                        </select>
                    </td>
                    <td class="py-3 px-4 text-center">
                        <button onclick="alert('Detalhes de ${arq.nome}')" class="text-indigo-400 hover:text-indigo-300 text-xs font-medium px-2.5 py-1 bg-indigo-500/10 rounded border border-indigo-500/20">Ver</button>
                    </td>
                </tr>
            `).join('');
        }

        function updateConsultant(id, newConsultant) {
            const item = allArchitects.find(a => a.id === id);
            if (item) item.consultor = newConsultant;
        }

        function carregarArquitetos() {
            renderTable(allArchitects);
        }

        // Pesquisa dinâmica em tempo real (mantém o foco perfeitamente no input)
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            const filtered = allArchitects.filter(a => 
                a.nome.toLowerCase().includes(term) ||
                (a.empresa && a.empresa.toLowerCase().includes(term)) ||
                (a.telefone && a.telefone.includes(term)) ||
                (a.email && a.email.toLowerCase().includes(term))
            );
            renderTable(filtered);
        });

        // Inicializar aplicação
        carregarArquitetos();
