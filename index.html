    function initFirebase() {
      if (window.firebase) {
        try {
          if (!firebase.apps.length) {
            firebase.initializeApp(EMBEDDED_FIREBASE_CONFIG);
          }
          db = firebase.firestore();
          isFirebaseActive = true;
          setupRealtimeListeners();
        } catch (e) {
          console.error("Erro Firebase:", e);
          syncError = e.message;
          isFirebaseActive = false;
          render();
        }
      }
    }

    function setupRealtimeListeners() {
      if (!db) return;

      db.collection("architects").onSnapshot(snapshot => {
        let archs = [];
        snapshot.forEach(doc => archs.push(doc.data()));
        if (archs.length > 0) {
          state.architects = archs;
          syncError = null;
          render();
        } else {
          // Se for a primeira inicialização do banco, semeia os registros
          state.architects.forEach(a => db.collection("architects").doc(a.id).set(a));
        }
      }, err => {
        console.error("Erro Firestore:", err);
        syncError = "Erro no Firebase. Verifique se as Regras do Firestore estão ABERTAS!";
        render();
      });
    }

    function updateConsultantAssignment(archId, newConsultant) {
      const arch = state.architects.find(a => a.id === archId);
      if (arch) {
        arch.consultant = newConsultant;
        
        if (isFirebaseActive && db) {
          db.collection("architects").doc(archId).set(arch, { merge: true })
            .then(() => console.log("Atualizado na nuvem em tempo real!"))
            .catch(err => alert("Erro ao atualizar no Firebase: " + err.message));
        }
        render();
      }
    }

    function createNewArchitect(e) {
      e.preventDefault();
      const name = document.getElementById('new-arch-name').value.trim();
      const company = document.getElementById('new-arch-company').value.trim();
      const city = document.getElementById('new-arch-city').value.trim() || "Rio de Janeiro/RJ";
      const phone = document.getElementById('new-arch-phone').value.trim();
      const email = document.getElementById('new-arch-email').value.trim();
      const consultant = document.getElementById('new-arch-consultant').value;

      const newId = "A" + String(state.architects.length + 1000).padStart(4, '0');
      const newArch = {
        id: newId,
        entryDate: new Date().toISOString().split('T')[0],
        name: name,
        company: company,
        city: city,
        phone: phone,
        email: email,
        consultant: consultant,
        status: "Novo",
        nextFollowUp: "",
        history: []
      };

      if (isFirebaseActive && db) {
        db.collection("architects").doc(newId).set(newArch);
      } else {
        state.architects.unshift(newArch);
      }

      state.showAddArchModal = false;
      render();
    }

    function daysSince(dateStr) {
      if (!dateStr) return 0;
      const now = new Date();
      const past = new Date(dateStr);
      const diffTime = Math.abs(now - past);
      return Math.floor(diffTime / (1000 * 60 * 60 * 24));
    }

    function getLastContactDate(arch) {
      if (arch.history && arch.history.length > 0) {
        return arch.history[arch.history.length - 1].date;
      }
      return arch.entryDate;
    }

    function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('login-u').value.trim().toLowerCase();
      const p = document.getElementById('login-p').value.trim();

      const found = state.users.find(user => user.username.toLowerCase() === u && user.pass === p);
      if (found) {
        state.currentUser = found;
        localStorage.setItem('proup_session', JSON.stringify(state.currentUser));
        render();
      } else {
        alert("Usuário ou senha incorretos!");
      }
    }

    function logout() {
      state.currentUser = null;
      localStorage.removeItem('proup_session');
      render();
    }

    function addFeedback(e, archId) {
      e.preventDefault();
      const status = document.getElementById('fb-status').value;
      const followUp = document.getElementById('fb-followup').value;
      const notes = document.getElementById('fb-notes').value.trim();

      const arch = state.architects.find(a => a.id === archId);
      if (arch) {
        arch.status = status;
        if (followUp) arch.nextFollowUp = followUp;
        if (!arch.history) arch.history = [];
        
        arch.history.push({
          date: new Date().toISOString().split('T')[0],
          user: state.currentUser.name,
          status: status,
          notes: notes
        });

        if (isFirebaseActive && db) {
          db.collection("architects").doc(archId).set(arch, { merge: true });
        }

        state.selectedArchForFeedback = null;
        render();
      }
    }

                  ${state.users.filter(u => u.role === 'consultant').map(u => {
                    const cnt = state.architects.filter(a => a.consultant === u.name).length;
                    return `<option value="${u.name}" ${state.consultantFilter === u.name ? 'selected' : ''}>${u.name} (${cnt})</option>`;
                  }).join('')}
                </select>
              ` : ''}

              <select onchange="state.statusFilter=this.value; render();" class="p-2 bg-brand-bg border border-brand-border rounded text-sm font-medium">
                <option value="all">Todos os Status</option>
                <option value="Novo">Novo</option>
                <option value="Em Contato">Em Contato</option>
                <option value="Reunião marcada">Reunião marcada</option>
                <option value="Proposta Enviada">Proposta Enviada</option>
                <option value="Parceria Fechada">Parceria Fechada</option>
                <option value="Sem Interesse">Sem Interesse</option>
              </select>
            </div>
          </div>

          ${filtered.length === 0 ? `
            <div class="bg-white p-12 text-center rounded-xl border border-brand-border space-y-2">
              <i class="fa-solid fa-folder-open text-3xl text-brand-muted"></i>
              <p class="font-bold text-brand">Nenhum arquiteto encontrado para esta visualização.</p>
              <p class="text-xs text-brand-muted">${!isElevated ? 'Assim que lhe for alocado um arquiteto na Fila, ele aparecerá aqui automaticamente.' : 'Tente mudar os filtros de busca no topo.'}</p>
            </div>
          ` : `
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              ${filtered.map(arch => {
                const lastContact = getLastContactDate(arch);
                const daysInactive = daysSince(lastContact);
                const isOverdue = daysInactive > 7;
                const isUnassigned = !arch.consultant || arch.consultant === '';

                return `
                  <div class="bg-white p-5 rounded-xl border ${isUnassigned ? 'border-amber-400 bg-amber-50/20' : (isOverdue ? 'border-rose-400 bg-rose-50/20' : 'border-brand-border')} shadow-sm space-y-3 flex flex-col justify-between">
                    <div>
                      <div class="flex justify-between items-start">
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-brand/10 text-brand uppercase">${arch.status}</span>
                        ${isUnassigned ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-amber-100 text-amber-800">⚠️ Na Fila</span>` : (isOverdue ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-rose-100 text-rose-700">⚠️ > 7 dias</span>` : '')}
                      </div>

                      <h3 class="font-bold text-base text-brand mt-2 cursor-pointer hover:underline" onclick="state.selectedArchHistory='${arch.id}'; render();">${arch.name}</h3>
                      <p class="text-xs text-brand-muted font-medium">${arch.company || 'Escritório Particular'}</p>
                      <p class="text-xs text-gray-500"><i class="fa-solid fa-location-dot mr-1"></i>${arch.city}</p>

                      <div class="mt-3 pt-3 border-t border-brand-border/60 text-xs space-y-2">
                        <p><i class="fa-solid fa-phone mr-1 text-brand-muted"></i> ${arch.phone}</p>
                        ${arch.email ? `<p class="break-all"><i class="fa-solid fa-envelope mr-1 text-brand-muted"></i> ${arch.email}</p>` : ''}
                        
                        <div class="pt-1">
                          <label class="block text-[10px] text-brand-muted uppercase font-bold mb-0.5">Consultor Responsável:</label>
                          ${isElevated ? `
                            <select onchange="updateConsultantAssignment('${arch.id}', this.value)" class="w-full p-1.5 ${isUnassigned ? 'bg-amber-100 border-amber-300' : 'bg-brand-bg border-brand-border'} rounded text-xs font-semibold text-brand focus:ring-1 focus:ring-brand">
                              <option value="" ${isUnassigned ? 'selected' : ''}>-- Sem Consultor (Fila) --</option>
                              ${state.users.filter(u => u.role === 'consultant').map(u => `
                                <option value="${u.name}" ${arch.consultant === u.name ? 'selected' : ''}>${u.name}</option>
                              `).join('')}
                            </select>
                          ` : `
                            <p class="text-brand font-semibold">${arch.consultant || 'Não Atribuído'}</p>
                          `}
                        </div>

                        <p class="text-[11px] text-gray-400 pt-1"><i class="fa-regular fa-clock mr-1"></i> Cadastrado em: ${arch.entryDate}</p>
                      </div>
                    </div>

                    <div class="pt-3 border-t border-brand-border flex gap-2">
                      <button onclick="state.selectedArchForFeedback='${arch.id}'; render();" class="flex-1 py-1.5 bg-brand text-white text-xs font-semibold rounded hover:bg-brand-light transition">
                        + Feedback
                      </button>
                      <button onclick="state.selectedArchHistory='${arch.id}'; render();" class="px-3 py-1.5 bg-brand-bg text-brand border border-brand-border text-xs font-semibold rounded hover:bg-white transition" title="Ver Histórico">
                        <i class="fa-solid fa-history"></i>
                      </button>
                      <a href="https://wa.me/55${arch.phone.replace(/\D/g, '')}" target="_blank" class="px-3 py-1.5 bg-emerald-600 text-white text-xs font-semibold rounded hover:bg-emerald-700 transition flex items-center justify-center" title="WhatsApp">
                        <i class="fa-brands fa-whatsapp"></i>
                      </a>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>
      `;
    }

    function renderAuditDashboard() {
      const inactiveArchs = state.architects.filter(a => daysSince(getLastContactDate(a)) > 7);
      const unassignedCount = state.architects.filter(a => !a.consultant || a.consultant === '').length;

      return `
        <div class="space-y-6">
          <div class="bg-white p-6 rounded-xl border border-brand-border shadow-sm">
            <h2 class="text-xl font-bold text-brand mb-2">Painel de Auditoria e Supervisão</h2>
            <p class="text-xs text-brand-muted">Monitoramento em tempo real do desempenho da equipe e alertas de inatividade.</p>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-xl border border-brand-border shadow-sm">
              <p class="text-xs text-brand-muted uppercase font-bold">Total na Base</p>
              <p class="text-3xl font-bold text-brand mt-1">${state.architects.length}</p>
            </div>
            <div class="bg-white p-4 rounded-xl border border-brand-border shadow-sm">
              <p class="text-xs text-amber-600 uppercase font-bold">Sem Consultor (Fila)</p>
              <p class="text-3xl font-bold text-amber-600 mt-1">${unassignedCount}</p>
            </div>
            <div class="bg-white p-4 rounded-xl border border-brand-border shadow-sm">
              <p class="text-xs text-rose-600 uppercase font-bold">Atrasados (> 7 dias)</p>
              <p class="text-3xl font-bold text-rose-600 mt-1">${inactiveArchs.length}</p>
            </div>
            <div class="bg-white p-4 rounded-xl border border-brand-border shadow-sm">
              <p class="text-xs text-emerald-600 uppercase font-bold">Atendimentos Registrados</p>
              <p class="text-3xl font-bold text-emerald-600 mt-1">${state.architects.reduce((acc, curr) => acc + (curr.history ? curr.history.length : 0), 0)}</p>
            </div>
          </div>

          <div class="bg-white p-6 rounded-xl border border-brand-border shadow-sm">
            <h3 class="font-bold text-brand mb-4">Arquitetos que Exigem Atenção (> 1 Semana sem Contato)</h3>
            <div class="space-y-3">
              ${inactiveArchs.length === 0 ? `
                <p class="text-xs text-emerald-600 font-semibold">Nenhum arquiteto atrasado no momento! Todos os contatos estão em dia.</p>
              ` : inactiveArchs.map(a => `
                <div class="p-3 bg-rose-50 border border-rose-200 rounded-lg flex justify-between items-center">
                  <div>
                    <p class="font-bold text-sm text-brand">${a.name}</p>
                    <p class="text-xs text-brand-muted">Consultor Responsável: <span class="font-semibold text-brand">${a.consultant || 'Não Alocado'}</span></p>
                  </div>
                  <span class="text-xs font-bold text-rose-700 bg-rose-100 px-2 py-1 rounded">${daysSince(getLastContactDate(a))} dias sem contato</span>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderUsersManagement() {
      return `
        <div class="space-y-6">
          <div class="bg-white p-6 rounded-xl border border-brand-border shadow-sm">
            <h2 class="text-xl font-bold text-brand mb-4">Gestão de Usuários e Consultores</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              ${state.users.map(u => {
                const assignedCount = state.architects.filter(a => a.consultant === u.name).length;
                return `
                  <div class="p-4 bg-brand-bg rounded-lg border border-brand-border flex justify-between items-center">
                    <div>
                      <p class="font-bold text-sm text-brand">${u.name}</p>
                      <p class="text-xs text-brand-muted">Login: <span class="font-mono">${u.username}</span></p>
                      <span class="inline-block mt-1 text-[10px] font-bold uppercase px-2 py-0.5 rounded ${u.role === 'admin' ? 'bg-purple-100 text-purple-700' : (u.role === 'supervisor' ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700')}">${u.role}</span>
                    </div>
                    ${u.role === 'consultant' ? `
                      <div class="text-right">
                        <span class="text-xl font-bold text-brand">${assignedCount}</span>
                        <p class="text-[10px] text-brand-muted">arquitetos</p>
                      </div>
                    ` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderAddArchModal() {
      return `
        <div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div class="bg-white max-w-lg w-full rounded-2xl shadow-2xl border border-brand-border p-6 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
              <h3 class="font-bold text-lg text-brand">Cadastrar Novo Arquiteto</h3>
              <button onclick="state.showAddArchModal=false; render();" class="text-gray-400 hover:text-black">&times;</button>
            </div>

            <form onsubmit="createNewArchitect(event)" class="space-y-3">
              <div>
                <label class="block text-xs font-semibold text-brand-muted uppercase mb-1">Nome Completo do Arquiteto *</label>
                <input type="text" id="new-arch-name" required class="w-full p-2 bg-brand-bg border border-brand-border rounded text-sm outline-none" placeholder="Ex: Lucas Andrade">
              </div>

              <div>
                <label class="block text-xs font-semibold text-brand-muted uppercase mb-1">Nome do Escritório / Empresa</label>
                <input type="text" id="new-arch-company" class="w-full p-2 bg-brand-bg border border-brand-border rounded text-sm outline-none" placeholder="Ex: Andrade Arquitetura">
              </div>

              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block text-xs font-semibold text-brand-muted uppercase mb-1">Telefone / WhatsApp *</label>
                  <input type="text" id="new-arch-phone" required class="w-full p-2 bg-brand-bg border border-brand-border rounded text-sm outline-none" placeholder="(21) 99999-9999">
                </div>
                <div>
                  <label class="block text-xs font-semibold text-brand-muted uppercase mb-1">Cidade/UF</label>
                  <input type="text" id="new-arch-city" value="Rio de Janeiro/RJ" class="w-full p-2 bg-brand-bg border border-brand-border rounded text-sm outline-none">
                </div>
              </div>

              <div>
                <label class="block text-xs font-semibold text-brand-muted uppercase mb-1">E-mail</label>
                <input type="email" id="new-arch-email" class="w-full p-2 bg-brand-bg border border-brand-border rounded text-sm outline-none" placeholder="arquiteto@email.com">
              </div>

              <div>
                <label class="block text-xs font-semibold text-brand-muted uppercase mb-1">Atribuir a Consultor</label>
                <select id="new-arch-consultant" class="w-full p-2 bg-brand-bg border border-brand-border rounded text-sm font-medium">
                  <option value="">-- Sem Consultor (Fila de Espera) --</option>
                  ${state.users.filter(u => u.role === 'consultant').map(u => `
                    <option value="${u.name}">${u.name}</option>
                  `).join('')}
                </select>
              </div>

              <div class="flex gap-2 justify-end pt-3 border-t">
                <button type="button" onclick="state.showAddArchModal=false; render();" class="px-4 py-2 border rounded text-xs font-semibold">Cancelar</button>
                <button type="submit" class="px-4 py-2 bg-brand text-white rounded text-xs font-semibold">Salvar Arquiteto</button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function renderFeedbackModal() {
      const arch = state.architects.find(a => a.id === state.selectedArchForFeedback);
      if (!arch) return '';

      return `
        <div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div class="bg-white max-w-lg w-full rounded-2xl shadow-2xl border border-brand-border p-6 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
              <h3 class="font-bold text-lg text-brand">Registrar Contato / Feedback</h3>
              <button onclick="state.selectedArchForFeedback=null; render();" class="text-gray-400 hover:text-black">&times;</button>
            </div>

            <p class="text-xs text-brand-muted">Arquiteto(a): <strong class="text-brand">${arch.name}</strong></p>

            <form onsubmit="addFeedback(event, '${arch.id}')" class="space-y-4">
              <div>
                <label class="block text-xs font-semibold text-brand-muted uppercase mb-1">Novo Status</label>
                <select id="fb-status" class="w-full p-2 bg-brand-bg border border-brand-border rounded text-sm font-medium">
                  <option value="Em Contato">Em Contato</option>
                  <option value="Reunião marcada">Reunião marcada</option>
                  <option value="Proposta Enviada">Proposta Enviada</option>
                  <option value="Parceria Fechada">Parceria Fechada</option>
                  <option value="Sem Interesse">Sem Interesse</option>
                </select>
              </div>

              <div>
                <label class="block text-xs font-semibold text-brand-muted uppercase mb-1">Data do Próximo Follow-up</label>
                <input type="date" id="fb-followup" required class="w-full p-2 bg-brand-bg border border-brand-border rounded text-sm">
              </div>

              <div>
                <label class="block text-xs font-semibold text-brand-muted uppercase mb-1">Observações e Feedback</label>
                <textarea id="fb-notes" required rows="4" placeholder="Descreva como foi o contato e o que foi combinado..." class="w-full p-2 bg-brand-bg border border-brand-border rounded text-sm outline-none"></textarea>
              </div>

              <div class="flex gap-2 justify-end pt-2">
                <button type="button" onclick="state.selectedArchForFeedback=null; render();" class="px-4 py-2 border rounded text-xs font-semibold">Cancelar</button>
                <button type="submit" class="px-4 py-2 bg-brand text-white rounded text-xs font-semibold">Salvar Registro</button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function renderHistoryModal() {
      const arch = state.architects.find(a => a.id === state.selectedArchHistory);
      if (!arch) return '';

      return `
        <div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div class="bg-white max-w-xl w-full rounded-2xl shadow-2xl border border-brand-border p-6 space-y-4 max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center border-b pb-3">
              <div>
                <h3 class="font-bold text-lg text-brand">${arch.name}</h3>
                <p class="text-xs text-brand-muted">${arch.company || 'Escritório Particular'}</p>
              </div>
              <button onclick="state.selectedArchHistory=null; render();" class="text-gray-400 hover:text-black">&times;</button>
            </div>

            <div class="flex-1 overflow-y-auto space-y-3">
              <h4 class="font-bold text-xs text-brand uppercase">Histórico de Interações</h4>
              ${(!arch.history || arch.history.length === 0) ? `
                <p class="text-xs text-gray-400 italic">Nenhuma interação registrada ainda.</p>
              ` : arch.history.map(h => `
                <div class="p-3 bg-brand-bg rounded-lg border border-brand-border space-y-1">
                  <div class="flex justify-between text-xs font-bold text-brand">
                    <span>${h.user}</span>
                    <span class="text-gray-400 font-normal">${h.date}</span>
                  </div>
                  <p class="text-xs text-emerald-700 font-semibold uppercase">${h.status}</p>
                  <p class="text-xs text-brand-text whitespace-pre-wrap">${h.notes}</p>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    window.onload = function() {
      initFirebase();
      render();
    };
  </script>
</body>
</html>
