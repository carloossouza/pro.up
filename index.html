<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Up - Gestão de Arquitetos e Consultores</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#2D3A31',
              dark: '#1F2822',
              light: '#3A4A3F',
              accent: '#4B5E51',
              bg: '#F4F6F4',
              surface: '#FFFFFF',
              border: '#E1E6E2',
              text: '#1C231E',
              muted: '#616F65'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            brand: ['Outfit', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- FIREBASE SDKs (v9 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    body { background-color: #F4F6F4; color: #1C231E; font-family: 'Inter', sans-serif; }
    h1, h2, h3, .font-brand { font-family: 'Outfit', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #F4F6F4; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #CBD5CE; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-brand-bg antialiased">

  <div id="app" class="flex-1 flex flex-col"></div>

  <script>
    // BASE DEFAULT DATA
    const INITIAL_USERS = [
      { username: 'admin', pass: '123456', name: 'Administrador Pro Up', role: 'admin' },
      { username: 'carlos', pass: '123456', name: 'Carlos Souza', role: 'admin' },
      { username: 'miriam', pass: '123456', name: 'Miriam', role: 'admin' },
      { username: 'fernando', pass: '123456', name: 'Fernando', role: 'consultant' },
      { username: 'vitor', pass: '123456', name: 'Vitor', role: 'consultant' },
      { username: 'renata', pass: '123456', name: 'Renata Eliza', role: 'consultant' },
      { username: 'estevao', pass: '123456', name: 'Estevão Fernando', role: 'consultant' },
      { username: 'dayane', pass: '123456', name: 'Dayane Gomes', role: 'consultant' }
    ];

    const INITIAL_ARCHITECTS = [
      { id: "A0001", entryDate: "2026-10-15", name: "Adriano Cesar Tavares Barroso", company: "Adriano Cesar Tavares Barroso", city: "Rio de Janeiro/RJ", phone: "(21) 98520-9919", email: "adrianotavares.arquiteto@gmail.com", instagram: "@adrianotavares.arquiteto", consultant: "Carlos Souza", status: "Reunião marcada", nextFollowUp: "2026-11-04", history: [{ date: "2026-10-22", user: "Carlos Souza", notes: "Contato inicial realizado via WhatsApp. Reunião agendada com sucesso." }] },
      { id: "A0002", entryDate: "2026-10-10", name: "Aline Azevedo Yamaki", company: "Aline Yamaki arquitetura e interiores", city: "Rio de Janeiro/RJ", phone: "(21) 98171-3557", email: "alineyamaki@hotmail.com", instagram: "@alineyamaki.arq", consultant: "Renata Eliza", status: "Novo", nextFollowUp: "", history: [] },
      { id: "A0003", entryDate: "2026-10-12", name: "Barbara Soares Da Paixao", company: "Barbara Paixão Arquitetura", city: "Rio de Janeiro/RJ", phone: "(21) 99963-5390", email: "barbarapaixao.arq@gmail.com", instagram: "@barbarapaixao.arq", consultant: "Renata Eliza", status: "Novo", nextFollowUp: "", history: [] },
      { id: "A0004", entryDate: "2026-10-25", name: "Juliana Jobim Rodrigues", company: "Juliana Jobim Arquitetura", city: "Rio de Janeiro/RJ", phone: "(21) 99304-8440", email: "jobimjuliana@gmail.com", instagram: "@julianajobim.arq", consultant: "Vitor", status: "Novo", nextFollowUp: "", history: [] },
      { id: "A0005", entryDate: "2026-10-18", name: "Luciene De Souza Braga", company: "Traço 7 Reformas", city: "Rio de Janeiro/RJ", phone: "(21) 99824-8833", email: "lucienebragainteriores@gmail.com", instagram: "@traco7interiores", consultant: "Estevão Fernando", status: "Novo", nextFollowUp: "", history: [] },
      { id: "A0006", entryDate: "2026-10-20", name: "Marcela Busmayer e Marina Policiano", company: "Maní Arquitetura LTDA", city: "Rio de Janeiro/RJ", phone: "(21) 99438-4018", email: "contato@estudiomani.com", instagram: "@estudiomani", consultant: "Fernando", status: "Novo", nextFollowUp: "", history: [] },
      { id: "A0007", entryDate: "2026-10-22", name: "Felipe Rohen", company: "Felipe Rohen Arquitetura", city: "Rio de Janeiro/RJ", phone: "(21) 98672-4057", email: "feliperohen.arq@hotmail.com", instagram: "@feliperohen.arq", consultant: "Fernando", status: "Novo", nextFollowUp: "", history: [] }
    ];

    // FIREBASE STATE
    let db = null;
    let isCloudActive = false;

    function initFirebase() {
      const savedConfig = localStorage.getItem('proup_firebase_cfg_v2');
      if (savedConfig) {
        try {
          const config = JSON.parse(savedConfig);
          if (!firebase.apps.length) {
            firebase.initializeApp(config);
          }
          db = firebase.firestore();
          isCloudActive = true;
          listenToCloud();
        } catch (err) {
          console.error("Erro no Firebase:", err);
          isCloudActive = false;
        }
      }
    }

    function listenToCloud() {
      if (!db) return;

      db.collection("architects").onSnapshot(snapshot => {
        const archs = [];
        snapshot.forEach(doc => archs.push({ id: doc.id, ...doc.data() }));
        if (archs.length > 0) {
          state.architects = archs;
          saveLocalData(state.users, state.architects);
          renderApp();
        } else {
          seedCloudData();
        }
      });

      db.collection("users").onSnapshot(snapshot => {
        const users = [];
        snapshot.forEach(doc => users.push(doc.data()));
        if (users.length > 0) {
          state.users = users;
          saveLocalData(state.users, state.architects);
          renderApp();
        }
      });
    }

    function seedCloudData() {
      if (!db) return;
      INITIAL_ARCHITECTS.forEach(a => db.collection("architects").doc(a.id).set(a));
      INITIAL_USERS.forEach(u => db.collection("users").doc(u.username).set(u));
    }

    function syncCloud(type, data) {
      if (!db || !isCloudActive) return;
      if (type === 'architect') db.collection("architects").doc(data.id).set(data);
      if (type === 'user') db.collection("users").doc(data.username).set(data);
    }

    function deleteCloudUser(username) {
      if (!db || !isCloudActive) return;
      db.collection("users").doc(username).delete();
    }

    // LOCAL STORAGE
    function loadLocalData() {
      const storedUsers = localStorage.getItem('proup_users_v5');
      const storedArchs = localStorage.getItem('proup_architects_v5');
      return {
        users: storedUsers ? JSON.parse(storedUsers) : INITIAL_USERS,
        architects: storedArchs ? JSON.parse(storedArchs) : INITIAL_ARCHITECTS
      };
    }

    function saveLocalData(users, architects) {
      if (users) localStorage.setItem('proup_users_v5', JSON.stringify(users));
      if (architects) localStorage.setItem('proup_architects_v5', JSON.stringify(architects));
    }

    function getCurrentSession() {
      const sess = localStorage.getItem('proup_session_v5');
      return sess ? JSON.parse(sess) : null;
    }

    function setSession(user) {
      if (user) localStorage.setItem('proup_session_v5', JSON.stringify(user));
      else localStorage.removeItem('proup_session_v5');
    }

    // STATE
    let state = {
      users: loadLocalData().users,
      architects: loadLocalData().architects,
      currentUser: getCurrentSession(),
      currentTab: 'architects',
      searchQuery: '',
      consultantFilter: 'all',
      statusFilter: 'all',
      selectedArchForFeedback: null,
      selectedArchForHistory: null,
      architectToEdit: null,
      userToEdit: null,
      userToDelete: null,
      isUserModalOpen: false,
      isFirebaseModalOpen: false,
      isEmbedModalOpen: false
    };

    function updateState(newState) {
      state = { ...state, ...newState };
      saveLocalData(state.users, state.architects);
      renderApp();
    }

    // HELPERS
    function daysSince(dateStr) {
      if (!dateStr) return 999;
      const today = new Date();
      const ref = new Date(dateStr);
      const diffTime = Math.abs(today - ref);
      return Math.floor(diffTime / (1000 * 60 * 60 * 24));
    }

    function getLastInteractionDate(a) {
      if (a.history && a.history.length > 0) {
        return a.history[a.history.length - 1].date;
      }
      return a.entryDate;
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
      return dateStr;
    }

    // ACTIONS
    function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('login-username').value.trim().toLowerCase();
      const p = document.getElementById('login-password').value.trim();

      const found = state.users.find(item => item.username.toLowerCase() === u && item.pass === p);
      if (found) {
        setSession(found);
        updateState({ currentUser: found, currentTab: 'architects' });
      } else {
        const err = document.getElementById('login-error');
        err.innerText = 'Usuário ou senha incorretos!';
        err.classList.remove('hidden');
      }
    }

    function logout() {
      setSession(null);
      updateState({ currentUser: null });
    }

    function downloadSourceCode() {
      const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'index.html';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // RENDER APP
    function renderApp() {
      const app = document.getElementById('app');
      
      if (!state.currentUser) {
        app.innerHTML = renderLogin();
        return;
      }

      app.innerHTML = `
        <!-- HEADER -->
        <header class="bg-brand text-white shadow-md border-b border-brand-dark sticky top-0 z-30">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            
            <!-- LOGO -->
            <div class="flex items-center space-x-4">
              <div class="bg-brand-bg px-4 py-2 rounded border border-white/20 shadow-inner flex items-center justify-center">
                <span class="font-brand text-2xl tracking-[0.25em] text-brand font-light lowercase">pro up</span>
              </div>
              <div class="hidden md:block text-xs border-l border-white/20 pl-4 py-1 text-gray-300">
                <p class="font-medium">Gestão de Arquitetos</p>
                <div class="flex items-center space-x-2 mt-0.5">
                  <span class="w-2 h-2 rounded-full ${isCloudActive ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400'}"></span>
                  <span class="text-[10px] opacity-80">${isCloudActive ? 'Nuvem Conectada' : 'Modo Local'}</span>
                </div>
              </div>
            </div>

            <!-- TABS -->
            <nav class="hidden md:flex items-center space-x-1 bg-brand-dark/50 p-1 rounded-lg border border-white/10">
              <button onclick="updateState({currentTab: 'architects'})" class="px-4 py-2 text-sm font-medium rounded-md transition ${state.currentTab === 'architects' ? 'bg-white text-brand shadow font-semibold' : 'text-gray-300 hover:text-white'}">
                <i class="fa-solid fa-users-rectangle mr-2"></i>Carteira
              </button>
              ${state.currentUser.role === 'admin' ? `
                <button onclick="updateState({currentTab: 'audit'})" class="px-4 py-2 text-sm font-medium rounded-md transition ${state.currentTab === 'audit' ? 'bg-white text-brand shadow font-semibold' : 'text-gray-300 hover:text-white'}">
                  <i class="fa-solid fa-chart-line mr-2"></i>Auditoria
                </button>
                <button onclick="updateState({currentTab: 'users'})" class="px-4 py-2 text-sm font-medium rounded-md transition ${state.currentTab === 'users' ? 'bg-white text-brand shadow font-semibold' : 'text-gray-300 hover:text-white'}">
                  <i class="fa-solid fa-user-gear mr-2"></i>Usuários
                </button>
              ` : ''}
            </nav>

            <!-- TOOLS & USER -->
            <div class="flex items-center space-x-2 sm:space-x-3">
              <button onclick="updateState({isEmbedModalOpen: true})" title="Google Sites" class="px-2.5 py-1.5 bg-white/10 hover:bg-white/20 border border-white/20 rounded-lg text-xs font-medium text-white transition flex items-center space-x-1">
                <i class="fa-solid fa-globe text-emerald-300"></i>
                <span class="hidden sm:inline">Google Sites</span>
              </button>

              <button onclick="downloadSourceCode()" title="Baixar Código HTML" class="px-2.5 py-1.5 bg-white/10 hover:bg-white/20 border border-white/20 rounded-lg text-xs font-medium text-white transition flex items-center space-x-1">
                <i class="fa-solid fa-download text-amber-300"></i>
                <span class="hidden sm:inline">Baixar HTML</span>
              </button>

              ${state.currentUser.role === 'admin' ? `
                <button onclick="updateState({isFirebaseModalOpen: true})" title="Configurar Nuvem" class="px-2.5 py-1.5 bg-white/10 hover:bg-white/20 border border-white/20 rounded-lg text-xs font-medium text-white transition flex items-center space-x-1">
                  <i class="fa-solid fa-cloud text-blue-300"></i>
                </button>
              ` : ''}

              <div class="text-right hidden sm:block pl-2 border-l border-white/20">
                <p class="text-xs font-semibold leading-tight">${state.currentUser.name}</p>
                <p class="text-[10px] text-emerald-300 uppercase font-mono">${state.currentUser.role === 'admin' ? 'Admin' : 'Consultor'}</p>
              </div>
              
              <button onclick="logout()" title="Sair" class="p-2 text-gray-300 hover:text-white hover:bg-white/10 rounded-lg transition">
                <i class="fa-solid fa-right-from-bracket text-base"></i>
              </button>
            </div>
          </div>
        </header>

        <!-- MAIN -->
        <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
          ${renderTabContent()}
        </main>

        <!-- MODALS -->
        ${state.selectedArchForFeedback ? renderFeedbackModal() : ''}
        ${state.selectedArchForHistory ? renderHistoryModal() : ''}
        ${state.architectToEdit ? renderArchitectModal() : ''}
        ${state.isUserModalOpen ? renderUserModal() : ''}
        ${state.userToDelete ? renderDeleteUserModal() : ''}
        ${state.isFirebaseModalOpen ? renderFirebaseModal() : ''}
        ${state.isEmbedModalOpen ? renderEmbedModal() : ''}
      `;
    }

    function renderLogin() {
      return `
        <div class="min-h-screen flex items-center justify-center bg-brand-bg p-4">
          <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-brand-border overflow-hidden">
            <div class="bg-brand p-8 text-center text-white">
              <div class="inline-block bg-brand-bg px-6 py-3 rounded-lg border border-white/20 shadow-inner mb-3">
                <span class="font-brand text-3xl tracking-[0.25em] text-brand font-light lowercase">pro up</span>
              </div>
              <p class="text-sm text-gray-300 font-light mt-1">Gestão de Parcerias e Arquitetos</p>
            </div>

            <form onsubmit="handleLogin(event)" class="p-8 space-y-5">
              <div id="login-error" class="hidden bg-rose-50 border border-rose-200 text-rose-700 text-xs p-3 rounded-lg"></div>

              <div>
                <label class="block text-xs font-semibold text-brand-muted uppercase tracking-wider mb-2">Usuário</label>
                <input type="text" id="login-username" required class="w-full px-4 py-3 bg-brand-bg border border-brand-border rounded-lg text-sm text-brand-text focus:outline-none focus:ring-2 focus:ring-brand" placeholder="Seu login (ex: carlos, miriam, fernando)">
              </div>

              <div>
                <label class="block text-xs font-semibold text-brand-muted uppercase tracking-wider mb-2">Senha</label>
                <input type="password" id="login-password" required class="w-full px-4 py-3 bg-brand-bg border border-brand-border rounded-lg text-sm text-brand-text focus:outline-none focus:ring-2 focus:ring-brand" placeholder="••••••••">
              </div>

              <button type="submit" class="w-full py-3 bg-brand text-white font-semibold rounded-lg hover:bg-brand-light transition shadow flex items-center justify-center space-x-2">
                <span>Entrar no Sistema</span>
                <i class="fa-solid fa-arrow-right"></i>
              </button>

              <div class="text-center pt-2 text-xs text-brand-muted border-t border-brand-border">
                <p>Usuários de teste (Senha <strong>123456</strong>):</p>
                <p class="font-mono mt-1">carlos, miriam (Admin) | fernando, vitor, renata (Consultores)</p>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function renderTabContent() {
      if (state.currentTab === 'users' && state.currentUser.role === 'admin') return renderUsersManagement();
      if (state.currentTab === 'audit' && state.currentUser.role === 'admin') return renderAuditDashboard();
      return renderArchitectsList();
    }

    // TAB 1: ARCHITECTS LIST
    function renderArchitectsList() {
      const today = new Date().toISOString().split('T')[0];
      
      let filtered = state.architects.filter(a => {
        if (state.currentUser.role === 'consultant') {
          if (a.consultant !== state.currentUser.name) return false;
        } else if (state.consultantFilter !== 'all') {
          if (state.consultantFilter === 'unassigned') {
            if (a.consultant && a.consultant !== '') return false;
          } else {
            if (a.consultant !== state.consultantFilter) return false;
          }
        }

        if (state.statusFilter !== 'all' && a.status !== state.statusFilter) return false;

        if (state.searchQuery) {
          const q = state.searchQuery.toLowerCase();
          return a.name.toLowerCase().includes(q) || (a.company || '').toLowerCase().includes(q) || (a.phone || '').toLowerCase().includes(q);
        }

        return true;
      });

      return `
        <div class="space-y-6">
          <!-- TOOLBAR -->
          <div class="bg-white p-5 rounded-xl border border-brand-border shadow-sm flex flex-col lg:flex-row gap-4 justify-between items-center">
            <div class="relative w-full lg:w-96">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                <i class="fa-solid fa-magnifying-glass"></i>
              </span>
              <input type="text" value="${state.searchQuery}" oninput="updateState({searchQuery: this.value})" placeholder="Buscar arquiteto, escritório, telefone..." class="w-full pl-10 pr-4 py-2.5 bg-brand-bg border border-brand-border rounded-lg text-sm text-brand-text focus:outline-none focus:ring-2 focus:ring-brand">
            </div>

            <div class="flex flex-wrap gap-3 w-full lg:w-auto">
              ${state.currentUser.role === 'admin' ? `
                <select onchange="updateState({consultantFilter: this.value})" class="bg-brand-bg border border-brand-border rounded-lg text-sm px-3 py-2.5 text-brand-text font-medium focus:outline-none">
                  <option value="all" ${state.consultantFilter === 'all' ? 'selected' : ''}>Todos os Consultores</option>
                  <option value="unassigned" ${state.consultantFilter === 'unassigned' ? 'selected' : ''}>Sem Consultor</option>
                  ${state.users.filter(u => u.role === 'consultant').map(u => `
                    <option value="${u.name}" ${state.consultantFilter === u.name ? 'selected' : ''}>${u.name}</option>
                  `).join('')}
                </select>
              ` : ''}

              <select onchange="updateState({statusFilter: this.value})" class="bg-brand-bg border border-brand-border rounded-lg text-sm px-3 py-2.5 text-brand-text font-medium focus:outline-none">
                <option value="all" ${state.statusFilter === 'all' ? 'selected' : ''}>Todos os Status</option>
                <option value="Novo" ${state.statusFilter === 'Novo' ? 'selected' : ''}>Novo</option>
                <option value="Em Contato" ${state.statusFilter === 'Em Contato' ? 'selected' : ''}>Em Contato</option>
                <option value="Reunião marcada" ${state.statusFilter === 'Reunião marcada' ? 'selected' : ''}>Reunião marcada</option>
                <option value="Proposta Enviada" ${state.statusFilter === 'Proposta Enviada' ? 'selected' : ''}>Proposta Enviada</option>
                <option value="Parceria Fechada" ${state.statusFilter === 'Parceria Fechada' ? 'selected' : ''}>Parceria Fechada</option>
                <option value="Sem Interesse" ${state.statusFilter === 'Sem Interesse' ? 'selected' : ''}>Sem Interesse</option>
              </select>

              ${state.currentUser.role === 'admin' ? `
                <button onclick="openArchitectModal()" class="bg-brand text-white text-sm px-4 py-2.5 rounded-lg hover:bg-brand-light transition font-medium flex items-center space-x-2">
                  <i class="fa-solid fa-plus"></i>
                  <span>Novo Arquiteto</span>
                </button>
              ` : ''}
            </div>
          </div>

          <!-- CARDS -->
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            ${filtered.length === 0 ? `
              <div class="col-span-full bg-white p-12 text-center rounded-xl border border-brand-border">
                <i class="fa-solid fa-folder-open text-4xl text-gray-300 mb-3"></i>
                <p class="text-brand-muted font-medium">Nenhum arquiteto encontrado para este filtro.</p>
              </div>
            ` : filtered.map(a => renderArchitectCard(a, today)).join('')}
          </div>
        </div>
      `;
    }

    function renderArchitectCard(a, today) {
      const cleanPhone = (a.phone || '').replace(/\D/g, '');
      const waLink = `https://api.whatsapp.com/send?phone=55${cleanPhone}&text=Olá%20${encodeURIComponent(a.name)},%20sou%20da%20equipe%20Pro%20Up!`;
      
      const lastDate = getLastInteractionDate(a);
      const inactiveDays = daysSince(lastDate);
      const isInactiveWarning = inactiveDays > 7;
      const isOverdue = a.nextFollowUp && a.nextFollowUp < today;

      return `
        <div class="bg-white rounded-xl border ${isInactiveWarning || isOverdue ? 'border-rose-300 ring-1 ring-rose-200' : 'border-brand-border'} shadow-sm hover:shadow-md transition flex flex-col justify-between overflow-hidden">
          <div class="p-5 space-y-3 flex-1 cursor-pointer" onclick="updateState({selectedArchForHistory: state.architects.find(item => item.id === '${a.id}')})">
            <div class="flex items-start justify-between gap-2">
              <div>
                <span class="text-[10px] font-mono text-brand-muted uppercase tracking-wider">${a.id}</span>
                <h3 class="font-bold text-brand text-base leading-snug hover:underline">${a.name}</h3>
                ${a.company ? `<p class="text-xs text-brand-muted font-medium mt-0.5"><i class="fa-solid fa-building mr-1 text-gray-400"></i>${a.company}</p>` : ''}
              </div>

    function saveFeedback(e) {
      e.preventDefault();
      const a = state.selectedArchForFeedback;
      if (!a) return;

      const newStatus = document.getElementById('fb-status').value;
      const nextFollowUp = document.getElementById('fb-followup').value;
      const notes = document.getElementById('fb-notes').value.trim();

      const today = new Date().toISOString().split('T')[0];
      const updatedHistory = a.history || [];
      updatedHistory.push({
        date: today,
        user: state.currentUser.name,
        status: newStatus,
        notes: notes
      });

      const updatedArch = { ...a, status: newStatus, nextFollowUp, history: updatedHistory };
      const updatedList = state.architects.map(item => item.id === a.id ? updatedArch : item);

      syncCloud('architect', updatedArch);
      updateState({ architects: updatedList, selectedArchForFeedback: null });
    }

                  <select id="arch-consultant" class="w-full p-2.5 bg-brand-bg border border-brand-border rounded-lg">
                    <option value="">Sem Consultor</option>
                    ${consultants.map(c => `<option value="${c.name}" ${a.consultant === c.name ? 'selected' : ''}>${c.name}</option>`).join('')}
                  </select>
                </div>
              </div>
              <div>
                <label class="block font-semibold text-brand mb-1">E-mail</label>
                <input type="email" id="arch-email" value="${a.email || ''}" class="w-full p-2.5 bg-brand-bg border border-brand-border rounded-lg">
              </div>

              <div class="pt-3 border-t border-brand-border flex justify-end space-x-2">
                <button type="button" onclick="updateState({architectToEdit: null})" class="px-4 py-2 bg-gray-200 text-brand font-semibold rounded-lg">Cancelar</button>
                <button type="submit" class="px-5 py-2 bg-brand text-white font-semibold rounded-lg">Salvar</button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function saveUser(e) {
      e.preventDefault();
      const u = state.userToEdit;
      const name = document.getElementById('usr-name').value.trim();
      const username = document.getElementById('usr-username').value.trim().toLowerCase();
      const pass = document.getElementById('usr-pass').value.trim();
      const role = document.getElementById('usr-role').value;

      let list = [...state.users];
      const newObj = { username, pass, name, role };

      if (list.some(item => item.username === username)) {
        list = list.map(item => item.username === username ? newObj : item);
      } else {
        list.push(newObj);
      }

      syncCloud('user', newObj);
      updateState({ users: list, isUserModalOpen: false, userToEdit: null });
    }

    function renderUserModal() {
      const u = state.userToEdit;
      const isEdit = !!u.username;

      return `
        <div class="fixed inset-0 bg-brand-dark/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div class="bg-white rounded-2xl max-w-md w-full border border-brand-border shadow-2xl overflow-hidden">
            <div class="bg-brand text-white p-5 flex justify-between items-center">
              <h3 class="font-bold text-base font-brand">${isEdit ? 'Editar Usuário' : 'Novo Usuário'}</h3>
              <button onclick="updateState({isUserModalOpen: false, userToEdit: null})" class="text-gray-300 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <form onsubmit="saveUser(event)" class="p-6 space-y-3 text-xs">
              <div>
                <label class="block font-semibold text-brand mb-1">Nome Completo *</label>
                <input type="text" id="usr-name" required value="${u.name || ''}" class="w-full p-2.5 bg-brand-bg border border-brand-border rounded-lg">
              </div>
              <div>
                <label class="block font-semibold text-brand mb-1">Login (Username) *</label>
                <input type="text" id="usr-username" ${isEdit ? 'readonly' : 'required'} value="${u.username || ''}" class="w-full p-2.5 bg-brand-bg border border-brand-border rounded-lg ${isEdit ? 'opacity-60 cursor-not-allowed' : ''}">
              </div>
              <div>
                <label class="block font-semibold text-brand mb-1">Senha *</label>
                <input type="password" id="usr-pass" required value="${u.pass || '123456'}" class="w-full p-2.5 bg-brand-bg border border-brand-border rounded-lg">
              </div>
              <div>
                <label class="block font-semibold text-brand mb-1">Função *</label>
                <select id="usr-role" class="w-full p-2.5 bg-brand-bg border border-brand-border rounded-lg">
                  <option value="consultant" ${u.role === 'consultant' ? 'selected' : ''}>Consultor</option>
                  <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Administrador</option>
                </select>
              </div>

              <div class="pt-3 border-t border-brand-border flex justify-end space-x-2">
                <button type="button" onclick="updateState({isUserModalOpen: false, userToEdit: null})" class="px-4 py-2 bg-gray-200 text-brand font-semibold rounded-lg">Cancelar</button>
                <button type="submit" class="px-5 py-2 bg-brand text-white font-semibold rounded-lg">Salvar Usuário</button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function confirmDeleteUser() {
      const u = state.userToDelete;
      if (!u) return;

      const newConsultant = document.getElementById('reassign-target').value;
      const updatedArchs = state.architects.map(a => {
        if (a.consultant === u.name) {
          const updated = { ...a, consultant: newConsultant };
          syncCloud('architect', updated);
          return updated;
        }
        return a;
      });

      const updatedUsers = state.users.filter(item => item.username !== u.username);
      deleteCloudUser(u.username);

      updateState({ users: updatedUsers, architects: updatedArchs, userToDelete: null });
    }

    function renderDeleteUserModal() {
      const u = state.userToDelete;
      const otherConsultants = state.users.filter(item => item.username !== u.username);

      return `
        <div class="fixed inset-0 bg-brand-dark/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div class="bg-white rounded-2xl max-w-md w-full border border-brand-border shadow-2xl overflow-hidden">
            <div class="bg-rose-700 text-white p-5 flex justify-between items-center">
              <h3 class="font-bold text-base font-brand">Remover Consultor</h3>
              <button onclick="updateState({userToDelete: null})" class="text-gray-300 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <div class="p-6 space-y-4 text-xs">
              <p>Você está removendo o usuário <strong>${u.name}</strong>.</p>
              <div>
                <label class="block font-semibold text-brand mb-1">Transferir carteira de arquitetos para:</label>
                <select id="reassign-target" class="w-full p-2.5 bg-brand-bg border border-brand-border rounded-lg">
                  <option value="">Deixar "Sem Consultor"</option>
                  ${otherConsultants.map(c => `<option value="${c.name}">${c.name}</option>`).join('')}
                </select>
              </div>

              <div class="pt-3 border-t border-brand-border flex justify-end space-x-2">
                <button type="button" onclick="updateState({userToDelete: null})" class="px-4 py-2 bg-gray-200 text-brand font-semibold rounded-lg">Cancelar</button>
                <button type="button" onclick="confirmDeleteUser()" class="px-5 py-2 bg-rose-600 text-white font-semibold rounded-lg">Confirmar Exclusão</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // INIT
    initFirebase();
    renderApp();
  </script>
</body>
</html>
